// V4.1：定位正确答案下标。历史数据里 q.a 与选项文本不完全一致
// （结尾标点、截断长度、手写简写等），indexOf 失败会返回 -1 导致"选对也判错"。
// 三级兜底：精确匹配 → 归一化（大小写/标点/空白）匹配 → 词重叠度最高的选项
function _resolveCorrectIdx(q) {
  const opts = (q && q.options) || [];
  let idx = opts.indexOf(q.a);
  if (idx >= 0) return idx;
  const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const na = norm(q.a);
  idx = opts.findIndex(o => {
    const no = norm(o);
    return no && na && (no === na || no.startsWith(na) || na.startsWith(no));
  });
  if (idx >= 0) return idx;
  // 词重叠兜底（应对手写题中"答案是选项的完整版"的情况）。
  // 注意：数字是关键区分信息（6 hours vs 3 hours），不能过滤；词尾 s 做词干化
  const stem = w => (w.length > 3 && !/\d/.test(w)) ? w.replace(/s$/, '') : w;
  const toks = s => norm(s).split(' ').filter(w => w.length > 1 || /\d/.test(w)).map(stem);
  const aWords = toks(q.a);
  let best = -1, bestScore = 0;
  opts.forEach((o, i) => {
    const oWords = new Set(toks(o));
    let score = 0;
    for (const w of aWords) if (oWords.has(w)) score++;
    if (score > bestScore) { bestScore = score; best = i; }
  });
  return best >= 0 ? best : 0;
}

function answerComprehension(optionIdx) {
  const studyDay = getStudyDay(appSettings);
  const lesson = DAILY_LESSONS.find(l => l.day === studyDay) || DAILY_LESSONS[0];
  const questions = lesson.listening.comprehension_questions || [];
  const q = questions[listeningState.questionsAnswered];
  if (!q) return;
  // 选项答题后不再 disabled（要点词释义），靠此守卫防止连点重复作答
  if (q._answered) return;
  q._answered = true;

  const correctIdx = _resolveCorrectIdx(q);

  const isCorrect = optionIdx === correctIdx;
  listeningState.questionsAnswered++;
  if (isCorrect) listeningState.questionsCorrect++;
  listeningState.comprehensionResults.push({ question: q.q, answer: q.options[optionIdx], correct: q.a, isCorrect });

  const canGloss = (typeof Gloss !== 'undefined' && Gloss.glossify);

  // 显示所有选项的对错；同时把选项文本换成可点词释义版本
  // （答题前故意不接点词——泄答案；答题后开放，方便查错选项里的生词）
  q.options.forEach((opt, i) => {
    const el = document.getElementById('opt-' + i);
    if (!el) return;
    el.classList.add('answered');
    el.removeAttribute('onclick');
    if (i === correctIdx) {
      el.classList.add('correct');
    } else if (i === optionIdx) {
      el.classList.add('incorrect');
    }
    if (canGloss) {
      const textEl = el.querySelector('.option-text');
      if (textEl) textEl.innerHTML = Gloss.glossify(opt);
    }
  });

  // 题干也开放点词（答题后不再泄答案）
  if (canGloss) {
    const stem = document.getElementById('comprehension-stem');
    if (stem) stem.innerHTML = Gloss.glossify(q.q);
  }

  // V4.1：解析 = 中文讲解（有则显示）+ 原文依据句（点词+重听），答对答错都给
  const srcSentence = q.src || _findSourceSentence(lesson.listening.text || '', q.a);
  listeningState.lastExplainSentence = srcSentence;
  const glossSentence = canGloss ? Gloss.glossify(srcSentence) : srcSentence;
  const explainHTML = `
    ${q.explain ? `<div class="text-secondary text-sm mt-md" style="line-height: 1.7;">💡 ${q.explain}</div>` : ''}
    <div class="mt-md" style="padding:10px 12px; background: var(--color-bg-subtle); border-radius: 10px;">
      <div class="text-light text-xs mb-sm">📍 答案出自原文这句（点击单词可查释义）：</div>
      <div style="font-size:15px; line-height:1.7;">${glossSentence}</div>
      <button class="btn btn-ghost btn-sm mt-sm" onclick="replayExplainSentence()">🔊 重听这句</button>
    </div>
  `;

  // 显示反馈
  const fb = document.getElementById('comprehension-feedback');
  const fbContent = document.getElementById('feedback-content');
  if (fb && fbContent) {
    fbContent.innerHTML = `
      <div class="${isCorrect ? 'text-mint' : 'text-coral'}" style="font-weight: 600;">
        ${isCorrect ? '✓ 正确！' : '✗ 不正确'}
      </div>
      <div class="text-secondary text-sm mt-sm">正确答案：${canGloss ? Gloss.glossify(q.a) : q.a}</div>
      ${explainHTML}
    `;
    fb.style.display = 'block';
  }
}

// V4：在原文中定位与正确答案词重叠最多的句子（作为答错解析的依据句）
function _findSourceSentence(text, answerText) {
  const sentences = String(text).match(/[^.!?]+[.!?]+/g) || [String(text)];
  const answerWords = String(answerText || '')
    .toLowerCase().replace(/[^a-z0-9'\s]/g, ' ')
    .split(/\s+/).filter(w => w.length > 2);
  let best = sentences[0], bestScore = -1;
  for (const s of sentences) {
    const lower = s.toLowerCase();
    let score = 0;
    for (const w of answerWords) if (lower.includes(w)) score++;
    if (score > bestScore) { bestScore = score; best = s; }
  }
  return best.trim();
}

// V3: micro-dictation — pick a key sentence, type what you hear, word-level diff
function _getDictationSentence() {
  const studyDay = getStudyDay(appSettings);
  const lesson = DAILY_LESSONS.find(l => l.day === studyDay) || DAILY_LESSONS[0];
  const text = lesson.listening.text || '';
  const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
  // prefer a sentence containing a keyword, else the longest one
  const keywords = lesson.listening.keywords || [];
  const withKw = sentences.find(s => keywords.some(kw => s.toLowerCase().includes(String(kw).toLowerCase())));
  if (withKw) return withKw.trim();
  return sentences.sort((a, b) => b.length - a.length)[0].trim();
}

function playDictationSentence(slow) {
  SpeechUtils.speak(_getDictationSentence(), { rate: slow ? 0.8 : 0.95 });
}

async function checkDictation() {
  const target = _getDictationSentence();
  const input = (document.getElementById('dictation-input') || {}).value || '';
  const norm = s => s.toLowerCase().replace(/[^a-z0-9'\s]/g, ' ').split(/\s+/).filter(Boolean);
  const targetWords = norm(target);
  const inputWords = norm(input);
  if (inputWords.length === 0) { showToast('请先写下你听到的内容'); return; }

  // LCS-based alignment to mark missed/extra words
  const m = targetWords.length, n = inputWords.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) {
    dp[i][j] = targetWords[i] === inputWords[j]
      ? dp[i + 1][j + 1] + 1
      : Math.max(dp[i + 1][j], dp[i][j + 1]);
  }
  const missed = [];
  let i = 0, j = 0;
  while (i < m && j < n) {
    if (targetWords[i] === inputWords[j]) { i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { missed.push(targetWords[i]); i++; }
    else { j++; }
  }
  while (i < m) { missed.push(targetWords[i]); i++; }

  const accuracy = m > 0 ? (m - missed.length) / m : 1;
  const pct = Math.round(accuracy * 100);
  const resultEl = document.getElementById('dictation-result');
  resultEl.style.display = 'block';
  resultEl.innerHTML = `
    <div class="${accuracy >= 0.9 ? 'text-mint' : accuracy >= 0.7 ? 'text-gold' : 'text-coral'}" style="font-weight: 600;">
      正确率 ${pct}%（${m - missed.length}/${m} 词）
    </div>
    <div class="text-sm mt-sm" style="line-height: 1.6;">原文：${target}</div>
    ${missed.length > 0 ? `<div class="text-coral text-sm mt-sm">没听出的词：${missed.join(', ')}</div>` : '<div class="text-mint text-sm mt-sm">全部听对，解码过关！</div>'}
  `;

  // record attempt; persist missed words to errorBank when decoding really failed
  try {
    await dbPut(STORES.learningAttempts, {
      id: uuid(), item_id: `dictation-day-${studyDaySafe()}`, date: todayStr(), timestamp: Date.now(),
      rating: accuracy >= 0.9 ? 'good' : accuracy >= 0.7 ? 'hard' : 'again',
      success: accuracy >= 0.9, dimension: 'recognition', quiz_type: 'dictation',
      answer_text: input
    });
    if (accuracy < 0.7 && missed.length > 0) {
      await dbPut(STORES.errorBank, {
        id: uuid(), original_answer: input, better_answer: target,
        error_type: 'listening_decoding', error_tag: 'dictation',
        explanation: `微听写漏听词：${missed.join(', ')}`,
        occurrence_count: 1, first_seen_at: new Date().toISOString(),
        last_seen_at: new Date().toISOString(), next_review_at: Date.now() + 86400000,
        resolved: false
      });
    }
  } catch (e) { /* non-critical */ }
}

async function rateReview(rating) {
  if (currentReviewIdx >= currentReviewItems.length) return;
  const { item, mastery, schedule } = currentReviewItems[currentReviewIdx];

  // 记录学习尝试
  const answer = document.getElementById('review-answer')?.value || '';
  const startTime = Date.now();
  const dimension = rating === 'easy' ? 'recall' : (rating === 'again' ? 'recognition' : 'recall');

  await dbPut(STORES.learningAttempts, {
    id: uuid(),
    item_id: item.id,
    date: todayStr(),
    rating,
    success: rating === 'good' || rating === 'easy',
    response_time: Date.now() - startTime,
    hint_used: !reviewAnswerVisible,
    answer_mode: 'text',
    answer_text: answer,
    dimension: dimension
  });

  // 更新掌握记录
  const updatedMastery = WEC_Algo.updateMastery(mastery, rating, {
    dimension,
    responseTime: Date.now() - startTime,
    hintUsed: !reviewAnswerVisible,
    answerMode: 'text'
  });
  await dbPut(STORES.masteryRecords, updatedMastery);

  // 更新复习排程
  await dbPut(STORES.reviewSchedule, {
    item_id: item.id,
    next_review_at: updatedMastery.next_review_at,
    interval_days: updatedMastery.interval_days,
    review_count: updatedMastery.review_count,
    mastery_state: updatedMastery.mastery_state
  });

  // 更新能力分数
  await updateSkillScore(item.skill_key || 'give_updates', rating === 'good' || rating === 'easy');

  // 如果答错，加入错题库
  if (rating === 'again' || rating === 'hard') {
    await dbPut(STORES.errorBank, {
      id: uuid(),
      original_answer: answer,
      better_answer: item.english,
      error_type: rating === 'again' ? 'recall_failure' : 'difficult',
      error_tag: dimension + '_weakness',
      explanation: item.usage_note || '',
      scenario_id: item.scenario_id,
      learning_item_id: item.id,
      occurrence_count: 1,
      first_seen_at: new Date().toISOString(),
      last_seen_at: new Date().toISOString(),
      next_review_at: Date.now() + 86400000,
      resolved: false
    });
  }

  currentReviewIdx++;
  renderReviewCard(document.getElementById('app'));
}

  await dbPut(STORES.skillScores, skill);
}

let assessmentAnswers = [-1, -1];
let assessmentSpeakingAnswer = '';

function startAssessment() {
  document.getElementById('assessment-start').style.display = 'none';
  document.getElementById('assessment-listening').style.display = 'block';
}

function assessAnswer(qIdx, optIdx, text, btn) {
  assessmentAnswers[qIdx] = optIdx;
  // 更新选项样式
  const options = btn.parentElement.querySelectorAll('.comprehension-option');
  options.forEach(o => o.classList.remove('selected'));
  btn.classList.add('selected');
  // 两题都答完后显示口语部分
  if (assessmentAnswers[0] >= 0 && assessmentAnswers[1] >= 0) {
    setTimeout(() => {
      document.getElementById('assessment-speaking').style.display = 'block';
      document.getElementById('assessment-speaking').scrollIntoView({ behavior: 'smooth' });
    }, 500);
  }
}

async function submitAssessment() {
  const answer = document.getElementById('assessment-answer').value.trim();
  if (!answer || answer.length < 10) {
    showToast('请写一段英语工作汇报（至少10个词）');
    return;
  }
  assessmentSpeakingAnswer = answer;

  // 计算初始分数
  const listeningCorrect = (assessmentAnswers[0] === 1 ? 1 : 0) + (assessmentAnswers[1] === 1 ? 1 : 0);
  const listeningScore = Math.round((listeningCorrect / 2) * 100);

  // 评估汇报质量（简单规则匹配）
  const hasStatus = /status|in progress|pending|working/i.test(answer);
  const hasReason = /reason|because|due to|caused/i.test(answer);
  const hasNext = /next step|will|plan to|going to|expect/i.test(answer);
  const structureScore = Math.round(((hasStatus ? 1 : 0) + (hasReason ? 1 : 0) + (hasNext ? 1 : 0)) / 3 * 100);
  const wordCount = answer.split(/\s+/).length;
  const fluencyScore = Math.min(100, Math.round(wordCount / 30 * 100));

  // 更新能力分数
  const skills = ['listening', 'give_updates', 'explain_reasons', 'suggest_next', 'continuous_speaking'];
  const scores = {
    listening: listeningScore,
    give_updates: structureScore,
    explain_reasons: hasReason ? 60 : 30,
    suggest_next: hasNext ? 60 : 30,
    continuous_speaking: fluencyScore
  };

  for (const key of skills) {
    const skill = await dbGet(STORES.skillScores, key);
    if (skill) {
      skill.score = scores[key];
      skill.evidence_count = 1;
      skill.updated_at = new Date().toISOString();
      await dbPut(STORES.skillScores, skill);
    }
  }

  // 保存测评记录
  await dbPut(STORES.assessments, {
    assessment_type: 'day0',
    date: todayStr(),
    listening_answers: assessmentAnswers,
    speaking_answer: assessmentSpeakingAnswer,
    scores
  });

  updateSettings({ assessmentCompleted: true });

  // 显示结果
  document.getElementById('assessment-speaking').style.display = 'none';
  const result = document.getElementById('assessment-result');
  result.style.display = 'block';
  document.getElementById('assessment-scores').innerHTML = `
    <div class="flex justify-between mb-sm"><span>听力理解</span><span class="badge ${listeningScore > 60 ? 'badge-mint' : listeningScore > 30 ? 'badge-gold' : 'badge-coral'}">${listeningScore}</span></div>
    <div class="flex justify-between mb-sm"><span>汇报结构</span><span class="badge ${structureScore > 60 ? 'badge-mint' : structureScore > 30 ? 'badge-gold' : 'badge-coral'}">${structureScore}</span></div>
    <div class="flex justify-between mb-sm"><span>原因表达</span><span class="badge ${hasReason ? 'badge-mint' : 'badge-coral'}">${hasReason ? 60 : 30}</span></div>
    <div class="flex justify-between mb-sm"><span>下一步表达</span><span class="badge ${hasNext ? 'badge-mint' : 'badge-coral'}">${hasNext ? 60 : 30}</span></div>
    <div class="flex justify-between mb-sm"><span>表达流畅度</span><span class="badge ${fluencyScore > 60 ? 'badge-mint' : fluencyScore > 30 ? 'badge-gold' : 'badge-coral'}">${fluencyScore}</span></div>
    <div class="text-light text-xs mt-md">这些分数将随你的学习进度持续更新。</div>
  `;
  result.scrollIntoView({ behavior: 'smooth' });
}

async function renderDailyChallenge(app, params) {
  const studyDay = getStudyDay(appSettings);
  const lesson = DAILY_LESSONS.find(l => l.day === studyDay) || DAILY_LESSONS[0];
  let challenge = lesson.challenge;
  const sessionBar = currentSession ? renderSessionBar(4) : '';

  // V3: fluency strand — every 3rd day, redo a previous challenge with less time (4/3/2 principle)
  let redoInfo = null;
  if (studyDay >= 4 && studyDay % 3 === 0) {
    try {
      const attempts = await dbGetAll(STORES.learningAttempts);
      const prev = attempts
        .filter(a => String(a.item_id || '').startsWith('challenge-day-') && a.answer_text)
        .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0))[0];
      if (prev) {
        const prevDay = parseInt(String(prev.item_id).replace('challenge-day-', ''), 10);
        const prevLesson = DAILY_LESSONS.find(l => l.day === prevDay);
        const prompt = prev.prompt || (prevLesson && prevLesson.challenge && prevLesson.challenge.prompt);
        if (prompt && prevDay !== studyDay) redoInfo = { prev, prompt, prevDay };
      }
    } catch (e) { /* fall back to new challenge */ }
  }
  if (redoInfo) challenge = { prompt: redoInfo.prompt };

  app.innerHTML = `
    <div class="container page">
      ${sessionBar}
      <div style="padding: 20px 0;">
        <div class="badge badge-gold mb-md">🏆 Daily Challenge</div>
        <h2>${redoInfo ? '重做挑战 · 提速版' : '今日挑战'}</h2>

        <div class="text-secondary text-sm mt-md">⏱ ${redoInfo ? '上次 45–60 秒，这次目标 35 秒' : '建议 45-60 秒完成'}</div>
        ${redoInfo ? `<div class="text-light text-xs mt-sm">🔁 这是 Day ${redoInfo.prevDay} 做过的任务——流利度来自"同样内容说得更快"</div>` : ''}
      </div>

          <button class="rating-btn again" onclick="rateChallenge('again')">没完成</button>
          <button class="rating-btn hard" onclick="rateChallenge('hard')">困难</button>
          <button class="rating-btn good" onclick="rateChallenge('good')">不错</button>
          <button class="rating-btn easy" onclick="rateChallenge('easy')">很好</button>
        </div>
      </div>

        ${!currentSession ? `<button class="btn btn-outline" onclick="navTo('today')">返回</button>` : ''}
        <button class="btn btn-primary flex-1" onclick="submitChallenge()">完成挑战</button>
      </div>
    </div>
  `;

}

function challengeVoiceInput() {
  if (!SpeechUtils.isSTTAvailable()) {
    showToast('当前浏览器不支持语音识别');
    return;
  }
  showToast('正在录音...');
  const input = document.getElementById('challenge-answer');
  SpeechUtils.startRecognition({
    onresult: (e) => { input.value = Array.from(e.results).map(r => r[0].transcript).join(''); },
    onend: () => showToast('录音结束'),
    onerror: () => showToast('语音识别出错')
  });
}

function showChallengeRef() {
  document.getElementById('challenge-ref').style.display = 'block';
}

function submitChallenge() {
  const answer = document.getElementById('challenge-answer').value.trim();
  if (!answer || answer.length < 5) {
    showToast('请先完成挑战');
    return;
  }
  showChallengeRef();
  document.getElementById('challenge-ref').scrollIntoView({ behavior: 'smooth' });
}

async function rateChallenge(rating) {
  const answer = document.getElementById('challenge-answer').value;
  const studyDay = getStudyDay(appSettings);
  const lesson = DAILY_LESSONS.find(l => l.day === studyDay) || DAILY_LESSONS[0];
  const promptShown = (document.querySelector('.card div[style*="font-size: 18px"]') || {}).textContent || lesson.challenge.prompt;
  await dbPut(STORES.learningAttempts, {
    id: uuid(), item_id: `challenge-day-${studyDay}`,
    date: todayStr(), timestamp: Date.now(), prompt: promptShown, rating, success: rating === 'good' || rating === 'easy',
    answer_text: answer, dimension: 'transfer', response_time: Date.now() - challengeStartTime
  });
  await updateSkillScore('continuous_speaking', rating === 'good' || rating === 'easy');
  await updateSkillScore('give_updates', rating === 'good' || rating === 'easy');

  if (currentSession) {
    completeSession();
  } else {
    showToast('挑战完成！');
    navTo('today');
  }
}

function renderKBItem(item, mastery) {
  const state = mastery ? mastery.mastery_state : 'New';
  const stateBadge = {
    'New': '<span class="badge badge-new">新</span>',
    'Learning': '<span class="badge badge-learning">学习中</span>',
    'Reviewing': '<span class="badge badge-reviewing">复习中</span>',
    'Mastered': '<span class="badge badge-mastered">已掌握</span>'
  }[state] || '<span class="badge badge-gray">新</span>';

  return `
    <div class="card card-clickable" onclick="editKBItem('${item.id}')">
      <div class="flex justify-between items-start">
        <div style="flex: 1; min-width: 0;">
          <div style="font-weight: 600; font-size: 16px;">${(typeof Gloss !== 'undefined' && Gloss.glossify) ? Gloss.glossify(item.english) : item.english}</div>
          <div class="text-secondary text-sm">${item.chinese}</div>
          <div class="flex gap-sm mt-sm">
            <span class="badge badge-gray">${item.type}</span>
            <span class="badge badge-gray">${item.work_context}</span>
            ${stateBadge}
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); speakKB('${item.id}')">🔊</button>
      </div>
    </div>
  `;
}

let kbFilter = { search: '', scenario: 'all' };

function filterKB() {
  kbFilter.search = document.getElementById('kb-search').value.toLowerCase();
  applyKBFilter();
}

function filterKBByScenario(scenario, btn) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  kbFilter.scenario = scenario;
  applyKBFilter();
}

async function applyKBFilter() {
  const allItems = await dbGetAll(STORES.knowledgeItems);
  const allMastery = await dbGetAll(STORES.masteryRecords);
  const masteryMap = {};
  allMastery.forEach(m => masteryMap[m.item_id] = m);

  let filtered = allItems;
  if (kbFilter.scenario !== 'all') filtered = filtered.filter(i => i.scenario_id === kbFilter.scenario);
  if (kbFilter.search) filtered = filtered.filter(i =>
    i.english.toLowerCase().includes(kbFilter.search) ||
    i.chinese.toLowerCase().includes(kbFilter.search)
  );

  document.getElementById('kb-list').innerHTML = filtered.map(item => renderKBItem(item, masteryMap[item.id])).join('') ||
    '<div class="empty-state"><div class="empty-state-icon">🔍</div><p>没有匹配的表达</p></div>';
}

function speakKB(itemId) {
  const item = KNOWLEDGE_ITEMS.find(i => i.id === itemId);
  if (item) SpeechUtils.speak(item.english, { rate: appSettings.speechRate });
}

async function editKBItem(itemId) {
  const item = await dbGet(STORES.knowledgeItems, itemId);
  if (!item) return;

  const overlay = showModal(`
    <h3>编辑表达</h3>
    <div class="mt-md">
      <label class="text-secondary text-sm">English</label>
      <input type="text" id="edit-en" value="${item.english.replace(/"/g, '&quot;')}" class="mt-sm">
    </div>
    <div class="mt-md">
      <label class="text-secondary text-sm">中文</label>
      <input type="text" id="edit-zh" value="${item.chinese.replace(/"/g, '&quot;')}" class="mt-sm">
    </div>
    <div class="mt-md">
      <label class="text-secondary text-sm">工作场景</label>
      <select id="edit-scenario" class="mt-sm">
        ${SCENARIOS.map(s => `<option value="${s.id}" ${item.scenario_id === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
      </select>
    </div>
    <div class="mt-md">
      <label class="text-secondary text-sm">工作相关度 (1-5)</label>
      <input type="number" id="edit-relevance" value="${item.work_relevance || 3}" min="1" max="5" class="mt-sm">
    </div>
    <div class="flex gap-md mt-lg">
      <button class="btn btn-danger btn-sm flex-1" onclick="deleteKBItem('${itemId}')">删除</button>
      <button class="btn btn-outline btn-sm flex-1" onclick="closeModal()">取消</button>
      <button class="btn btn-primary btn-sm flex-1" onclick="saveKBItem('${itemId}')">保存</button>
    </div>
  `);
}

async function saveKBItem(itemId) {
  const item = await dbGet(STORES.knowledgeItems, itemId);
  item.english = document.getElementById('edit-en').value;
  item.chinese = document.getElementById('edit-zh').value;
  item.scenario_id = document.getElementById('edit-scenario').value;
  item.work_relevance = parseInt(document.getElementById('edit-relevance').value);
  item.updated_at = new Date().toISOString();
  await dbPut(STORES.knowledgeItems, item);
  closeModal();
  showToast('已保存');
  renderKnowledgeBase(document.getElementById('app'));
}

async function deleteKBItem(itemId) {
  if (!confirm('确认删除这个表达？')) return;
  await dbDelete(STORES.knowledgeItems, itemId);
  await dbDelete(STORES.masteryRecords, itemId);
  await dbDelete(STORES.reviewSchedule, itemId);
  closeModal();
  showToast('已删除');
  renderKnowledgeBase(document.getElementById('app'));
}

            <p class="text-light text-xs mt-sm">在词汇练习或工作练习中答错时会自动记录</p>
          </div>
        ` : sorted.map(e => renderErrorItem(e)).join('')}
      </div>
    </div>
  `;
}

let errorFilter = 'all';

function filterErrors(filter, btn) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  errorFilter = filter;
  applyErrorFilter();
}

async function applyErrorFilter() {
  const allErrors = await dbGetAll(STORES.errorBank);
  let filtered = allErrors;
  if (errorFilter === 'unresolved') filtered = filtered.filter(e => !e.resolved);
  if (errorFilter === 'resolved') filtered = filtered.filter(e => e.resolved);
  filtered.sort((a, b) => new Date(b.last_seen_at || 0) - new Date(a.last_seen_at || 0));
  document.getElementById('error-list').innerHTML = filtered.length === 0 ?
    '<div class="empty-state"><p>没有记录</p></div>' :
    filtered.map(e => renderErrorItem(e)).join('');
}

function renderErrorItem(e) {
  var isVocab = !!e.vocab_id;
  var title = isVocab ? (e.word || e.vocab_id) : (e.better_answer || '表达错误');
  var subtitle = isVocab ? '词汇 · ' + (e.quiz_type || e.error_type || '') : '表达 · ' + (e.error_type || '');
  var userAns = e.user_answer || e.original_answer || '(空)';
  var correctAns = e.correct_answer || e.better_answer || '';
  var expl = e.explanation || '';
  var occCount = e.occurrence_count || 1;
  var lastDate = e.last_seen_at ? new Date(e.last_seen_at).toLocaleDateString('zh-CN') : '—';
  var nextDate = e.next_review_at ? new Date(e.next_review_at).toLocaleDateString('zh-CN') : '—';

  var glossFn = (typeof Gloss !== 'undefined' && Gloss.glossify) ? Gloss.glossify : function (s) { return s; };

  return `
    <div class="error-bank-card ${e.resolved ? 'resolved' : ''}">
      <div class="eb-header">
        <div>
          <div class="eb-word">${glossFn(title)}</div>
          <div class="eb-type">${subtitle}</div>
        </div>
        <div style="text-align: right;">
          <div class="eb-count">×${occCount}</div>
          ${e.resolved ? '<span class="badge badge-mint" style="font-size:11px;">已解决</span>' : '<span class="badge badge-coral" style="font-size:11px;">未解决</span>'}
        </div>
      </div>
      <div class="eb-detail">
        <div style="color: var(--color-coral);">你的答案：${userAns}</div>
        <div style="color: var(--color-primary);">正确答案：${glossFn(correctAns)}</div>
        ${expl ? `<div style="margin-top: 6px; padding: 8px 10px; background: var(--color-bg-subtle); border-radius: 10px; font-size: 13px; line-height: 1.6;">💡 ${expl}</div>` : ''}
      </div>
      <div class="text-light text-xs" style="margin-top: 6px;">
        最近错误：${lastDate} · 下次复习：${nextDate}
        ${e.hint_used ? ' · 使用了提示' : ''}${e.answer_revealed ? ' · 查看了答案' : ''}
      </div>
      <div class="eb-actions">
        ${isVocab ? `<button class="btn btn-ghost btn-sm" style="background: var(--color-coral); color: white;" onclick="retryVocabError('${e.id}')">立即重练</button>` : `<button class="btn btn-ghost btn-sm" onclick="retryExpressionError('${e.id}')">再练一次</button>`}
        ${!e.resolved ? `<button class="btn btn-ghost btn-sm" onclick="resolveError('${e.id}')">标记已解决</button>` : ''}
      </div>
    </div>
  `;
}

async function resolveError(id) {
  const e = await dbGet(STORES.errorBank, id);
  if (e) {
    e.resolved = true;
    e.resolved_at = new Date().toISOString();
    await dbPut(STORES.errorBank, e);
    showToast('已标记为解决');
    renderErrorBank(document.getElementById('app'));
  }
}

async function retryVocabError(id) {
  const e = await dbGet(STORES.errorBank, id);
  if (e && e.vocab_id) {
    startVocabRetry([e.vocab_id]);
  }
}

async function retryExpressionError(id) {
  navTo('review');
  showToast('进入复习模式');
}

let quizState = null;

async function renderQuiz(app) {
  const allItems = await dbGetAll(STORES.knowledgeItems);
  const allMastery = await dbGetAll(STORES.masteryRecords);
  const masteryMap = {};
  allMastery.forEach(m => masteryMap[m.item_id] = m);

  // 随机选题（优先非Mastered）
  const candidates = allItems.filter(i => {
    const m = masteryMap[i.id];
    return !m || m.mastery_state !== 'Mastered';
  });
  const quizItems = candidates.sort(() => Math.random() - 0.5).slice(0, 10);

  quizState = {
    items: quizItems,
    idx: 0,
    answers: [],
    startTime: Date.now()
  };

  renderQuizQuestion(app);
}

function renderQuizQuestion(app) {
  if (quizState.idx >= quizState.items.length) {
    renderQuizResult(app);
    return;
  }

  const item = quizState.items[quizState.idx];
  const qType = ['cn-to-en', 'fill-blank', 'multi-choice'][Math.floor(Math.random() * 3)];

  let questionHTML = '';
  switch(qType) {
    case 'cn-to-en':
      questionHTML = `
        <div class="text-secondary text-sm mb-sm">看到中文，写出英文表达</div>
        <div style="font-size: 20px; font-weight: 600; padding: 16px; background: var(--color-bg-subtle); border-radius: 12px;">${item.chinese}</div>
      `;
      break;
    case 'fill-blank':
      const words = item.example_sentence.split(' ');
      const blankIdx = Math.min(words.length - 1, Math.floor(words.length / 2));
      const blankWord = words[blankIdx];
      questionHTML = `
        <div class="text-secondary text-sm mb-sm">填空</div>
        <div style="font-size: 17px; padding: 16px; background: var(--color-bg-subtle); border-radius: 12px; line-height: 1.8;">${words.map((w,i) => i === blankIdx ? '____' : w).join(' ')}</div>
      `;
      break;
    case 'multi-choice':
      const otherItems = quizState.items.filter(i => i.id !== item.id).sort(() => Math.random() - 0.5).slice(0, 3);
      const options = [item, ...otherItems].sort(() => Math.random() - 0.5);
      questionHTML = `
        <div class="text-secondary text-sm mb-sm">选择正确的英文表达</div>
        <div style="font-size: 18px; font-weight: 600; padding: 16px; background: var(--color-bg-subtle); border-radius: 12px; margin-bottom: 12px;">${item.chinese}</div>
        ${options.map((opt, i) => `
          <div class="list-item card-clickable" onclick="answerMC('${opt.id}', '${item.id}')">
            <div class="list-item-icon" style="background: var(--color-bg-subtle); font-weight: 600;">${String.fromCharCode(65+i)}</div>
            <div class="list-item-content"><div class="list-item-title">${opt.english}</div></div>
          </div>
        `).join('')}
      `;
      break;
  }

  app.innerHTML = `
    <div class="container page">
      <div style="padding: 20px 0;">
        <div class="flex justify-between items-center">
          <h2>Quiz</h2>
          <span class="badge badge-primary">${quizState.idx + 1} / ${quizState.items.length}</span>
        </div>
        <div class="progress-bar mt-md"><div class="progress-bar-fill" style="width: ${quizState.idx / quizState.items.length * 100}%"></div></div>
      </div>

      <div class="card">
        ${questionHTML}
      </div>

      ${qType !== 'multi-choice' ? `
      <div class="card">
        <textarea id="quiz-answer" placeholder="输入你的回答..." style="min-height: 80px;"></textarea>
        <button class="btn btn-primary btn-block mt-md" onclick="submitQuizAnswer('${item.id}', '${qType}')">提交</button>
      </div>
      ` : ''}

      <button class="btn btn-ghost btn-sm mt-md" onclick="navTo('more')">退出</button>
    </div>
  `;
}

function answerMC(selectedId, correctId) {
  quizState.answers.push({ item_id: correctId, correct: selectedId === correctId, answer: selectedId });
  quizState.idx++;
  renderQuizQuestion(document.getElementById('app'));
}

async function submitQuizAnswer(itemId, qType) {
  const answer = document.getElementById('quiz-answer').value.trim();
  const item = await dbGet(STORES.knowledgeItems, itemId);
  let correct = false;
  if (qType === 'cn-to-en') {
    correct = answer.toLowerCase().includes(item.english.toLowerCase().split(' ')[0]) || answer.toLowerCase() === item.english.toLowerCase();
  } else if (qType === 'fill-blank') {
    const blankWord = item.example_sentence.split(' ')[Math.floor(item.example_sentence.split(' ').length / 2)];
    correct = answer.toLowerCase().includes(blankWord.toLowerCase());
  }

  quizState.answers.push({ item_id: itemId, correct, answer });
  quizState.idx++;
  renderQuizQuestion(document.getElementById('app'));
}

async function renderQuizResult(app) {
  const correct = quizState.answers.filter(a => a.correct).length;
  const total = quizState.answers.length;
  const score = Math.round(correct / total * 100);

  // 记录测验
  await dbPut(STORES.quizAttempts, {
    id: uuid(), date: todayStr(), score, total, correct,
    duration: Date.now() - quizState.startTime
  });

  app.innerHTML = `
    <div class="container page">
      <div style="padding: 40px 20px; text-align: center;">
        <div style="font-size: 64px;">${score >= 70 ? '🎉' : score >= 40 ? '💪' : '📚'}</div>
        <h1 style="margin-top: 16px;">${score} 分</h1>
        <p class="text-secondary mt-sm">${correct} / ${total} 正确</p>
      </div>

      <div class="card">
        <div class="text-secondary text-sm mb-md">答题详情</div>
        ${quizState.answers.map((a, i) => `
          <div class="flex justify-between" style="padding: 8px 0; border-bottom: 1px solid var(--color-border-light);">
            <span class="text-sm">第 ${i+1} 题</span>
            <span class="badge ${a.correct ? 'badge-mint' : 'badge-coral'}">${a.correct ? '✓ 正确' : '✗ 错误'}</span>
          </div>
        `).join('')}
      </div>

      <button class="btn btn-primary btn-block btn-lg mt-lg" onclick="navTo('more')">完成</button>
    </div>
  `;
}

function switchImportMode(mode, btn) {

  document.getElementById('import-paste').style.display = mode === 'paste' ? 'block' : 'none';
  document.getElementById('import-file').style.display = mode === 'file' ? 'block' : 'none';
}

async function handleFileImport(event) {
  const file = event.target.files[0];
  if (!file) return;

  const maxSize = 5 * 1024 * 1024; // 5MB
  if (file.size > maxSize) {
    showToast('文件过大（最大5MB）');
    return;
  }

  const reader = new FileReader();
  reader.onload = async (e) => {
    const text = e.target.result;

    // 如果是JSON，尝试解析ChatGPT格式
    if (file.name.endsWith('.json')) {
      try {
        const data = JSON.parse(text);
        if (data && Array.isArray(data)) {
          // ChatGPT conversations.json 格式
          let allText = '';
          for (const conv of data) {
            if (conv.title) allText += conv.title + '\n';
            if (conv.mapping) {
              for (const node of Object.values(conv.mapping)) {
                if (node.message && node.message.content && node.message.content.parts) {
                  const role = node.message.author?.role || '';
                  if (role === 'user' || role === 'assistant') {
                    allText += role + ': ' + node.message.content.parts.join(' ') + '\n';
                  }
                }
              }
            }
          }
          await processImportText(allText, file.name);
          return;
        }
      } catch (err) {
        // JSON解析失败，当作普通文本处理
      }
    }
    await processImportText(text, file.name);
  };
  reader.readAsText(file);
}

async function processImport() {
  const text = document.getElementById('import-text').value.trim();
  if (!text || text.length < 10) {
    showToast('请输入对话内容');
    return;
  }
  await processImportText(text, 'paste-' + Date.now());
}

async function processImportText(text, sourceName) {
  const resultDiv = document.getElementById('import-result');
  resultDiv.style.display = 'block';
  resultDiv.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

  // 清洗：去除时间戳、角色标签等
  const cleaned = text
    .replace(/^\[\d{4}-\d{2}-\d{2}.*?\]/gm, '')
    .replace(/^User:?\s/gm, '')
    .replace(/^Assistant:?\s/gm, '')
    .replace(/^Human:?\s/gm, '')
    .replace(/^AI:?\s/gm, '')
    .replace(/```[\s\S]*?```/g, '') // 去除代码块
    .replace(/^>.*$/gm, '') // 去除引用
    .trim();

  // 分析
  const analysis = AIAdapter.analyzeCorpus(cleaned);

  // 保存导入记录
  const importId = uuid();
  await dbPut(STORES.imports, {
    id: importId,
    source_name: sourceName,
    import_date: new Date().toISOString(),
    original_text: text,
    cleaned_text: cleaned,
    status: 'processed',
    scenario_count: analysis.scenarios.length,
    item_count: analysis.learning_items.length
  });

  // 将提取的学习项保存到知识库
  let addedCount = 0;
  for (const item of analysis.learning_items) {
    if (item.english && item.english.length > 15) {
      const newItem = {
        id: uuid(),
        type: item.type || 'work_expression',
        english: item.english,
        chinese: item.chinese || '(待翻译)',
        example_sentence: item.english,
        work_context: '导入内容',
        scenario_id: item.scenario_id || 'other',
        source_conversation_id: importId,
        source: 'import',
        difficulty: 3,
        work_relevance: 3,
        frequency: 2,
        reusability: 3,
        communication_value: 3,
        status: 'needs_confirmation',
        needs_confirmation: true,
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      };
      await dbPut(STORES.knowledgeItems, newItem);

      const mastery = WEC_Algo.initMastery(newItem.id);
      await dbPut(STORES.masteryRecords, mastery);
      await dbPut(STORES.reviewSchedule, {
        item_id: newItem.id, next_review_at: Date.now(),
        interval_days: 0, review_count: 0, mastery_state: 'New'
      });
      addedCount++;
    }
  }

  resultDiv.innerHTML = `
    <div class="card">
      <div class="text-secondary text-sm mb-md">导入结果</div>
      <div class="flex justify-between mb-sm"><span>识别场景</span><span class="badge badge-gray">${analysis.scenarios.length}</span></div>
      <div class="flex justify-between mb-sm"><span>提取表达</span><span class="badge badge-mint">${addedCount}</span></div>
      <div class="flex justify-between mb-sm"><span>识别角色</span><span class="badge badge-gray">${analysis.roles.length}</span></div>
      <div class="flex justify-between"><span>处理状态</span><span class="badge badge-gold">需确认</span></div>
      <div class="text-light text-xs mt-md">提取的内容已标记为「需确认」，不会自动加入课程。请在 Knowledge Base 中查看和编辑。</div>
    </div>

    ${analysis.scenarios.length > 0 ? `
    <div class="card">
      <div class="text-secondary text-sm mb-sm">识别到的场景</div>
      ${analysis.scenarios.map(sid => {
        const s = SCENARIOS.find(s => s.id === sid);
        return s ? `<div class="badge badge-gray" style="margin: 2px;">${s.name}</div>` : '';
      }).join('')}
    </div>
    ` : ''}

    <div class="flex gap-md mt-lg">
      <button class="btn btn-outline flex-1" onclick="navTo('import')">继续导入</button>
      <button class="btn btn-primary flex-1" onclick="navTo('knowledge-base')">查看知识库</button>
    </div>
  `;
}

  try {
    const text = await file.text();
    const data = JSON.parse(text);

    // 验证格式
    if (!data._meta || data._meta.app !== 'WorkEnglishCoach') {
      showToast('文件格式不正确：不是 Work English Coach 备份文件');
      return;
    }

    if (!confirm('导入将替换当前数据（会先备份）。确认继续？')) return;

    await importAllData(data, true);
    showToast('数据导入成功！');
    navTo('today');

// ===== js/vocab.js =====
// ===== Vocabulary Learning Module =====
// Handles pre-check, learn, quiz (6 types), error analysis, and mastery tracking.
// Depends on: VOCAB_ITEMS, STORES, dbGet/dbGetAll/dbPut/dbCount/dbGetByIndex,
//   WEC_Algo, todayStr(), uuid(), showToast(), navTo(), SpeechUtils

// ---------------------------------------------------------------------------
// 1. Session State
// ---------------------------------------------------------------------------

let vocabSession = null;

// ---------------------------------------------------------------------------
// 2. Word Selection Logic
// ---------------------------------------------------------------------------

/**
 * Select today's vocabulary words.
 * Merges due reviews, unresolved error-bank words, and new words for the day.
 * @returns {Promise<Array>} array of VOCAB_ITEMS to study
 */
async function getDailyVocabWords(day) {
  let dueReviews = [];
  let errorWords = [];
  let newWords = [];

  // --- due reviews from reviewSchedule ---
  try {
    const allSchedule = await dbGetAll(STORES.reviewSchedule);
    const now = Date.now();
    const due = allSchedule
      .filter(s => s.next_review_at <= now)
      .sort((a, b) => a.next_review_at - b.next_review_at);
    // resolve to vocab items (reviewSchedule.item_id == vocab id for vocab items)
    for (const s of due) {
      const v = VOCAB_ITEMS.find(item => item.id === s.item_id);
      if (v) dueReviews.push(v);
    }
  } catch (e) {
    console.warn('[vocab] getDailyVocabWords: reviewSchedule failed', e);
  }

  // --- unresolved error-bank words ---
  try {
    const allErrors = await dbGetAll(STORES.errorBank);
    const unresolved = allErrors.filter(e => !e.resolved);
    const seenIds = new Set();
    for (const err of unresolved) {
      if (err.vocab_id && !seenIds.has(err.vocab_id)) {
        const v = VOCAB_ITEMS.find(item => item.id === err.vocab_id);
        if (v) {
          errorWords.push(v);
          seenIds.add(v.id);
        }
      }
    }
  } catch (e) {
    console.warn('[vocab] getDailyVocabWords: errorBank failed', e);
  }

  // --- new words for current day ---
  newWords = VOCAB_ITEMS.filter(v => v.day === day);

  // --- V4：用户点词加入的学习队列（gloss.js 写入 localStorage） ---
  let userQueueWords = [];
  try {
    const queueIds = JSON.parse(localStorage.getItem('wec_user_queue') || '[]');
    const customWords = JSON.parse(localStorage.getItem('wec_custom_words') || '[]');
    if (Array.isArray(queueIds) && queueIds.length > 0) {
      const masteredIds = new Set();
      try {
        const allMastery = await dbGetAll(STORES.masteryRecords);
        allMastery.forEach(m => { if (m.mastery_state === 'Mastered') masteredIds.add(m.item_id); });
      } catch (e) {}
      const remaining = [];
      for (const id of queueIds) {
        // 词库词或用户自定义词
        const v = VOCAB_ITEMS.find(item => item.id === id) ||
                  customWords.find(item => item.id === id);
        if (!v) continue;
        if (masteredIds.has(id)) continue; // 已掌握则移出队列
        userQueueWords.push(v);
        remaining.push(id);
      }
      // 写回（剔除已掌握/失效的）
      localStorage.setItem('wec_user_queue', JSON.stringify(remaining));
    }
  } catch (e) {
    console.warn('[vocab] user queue merge failed', e);
  }

  // --- selection rules (V3: adaptive new-word count 6/8/10 by recent accuracy) ---
  const dueCount = dueReviews.length;

  // recent 3-day vocab quiz accuracy from learningAttempts
  let recentAccuracy = null;
  try {
    const attempts = await dbGetAll(STORES.learningAttempts);
    const cutoff = Date.now() - 3 * 86400000;
    const recent = attempts.filter(a =>
      a.item_id && String(a.item_id).startsWith('v-') &&
      a.timestamp && a.timestamp >= cutoff
    );
    if (recent.length >= 5) {
      const ok = recent.filter(a => a.success).length;
      recentAccuracy = ok / recent.length;
    }
  } catch (e) {
    console.warn('[vocab] recent accuracy failed', e);
  }

  let newMax;
  if (recentAccuracy !== null && recentAccuracy < 0.7) newMax = 6;      // struggling: slow down
  else if (recentAccuracy !== null && recentAccuracy > 0.9) newMax = 10; // cruising: speed up
  else newMax = 8;                                                        // default sustainable pace
  // V4：复习:新学 ≈ 3:1 —— 复习量主导新词配额，防止复习队列雪崩
  // （仅在复习积压时收紧；复习很少时不限制新词，保证学习推进）
  if (dueCount > 30) newMax = 0;                                            // 队列雪崩：暂停新词，先清复习
  else if (dueCount >= 6) newMax = Math.min(newMax, Math.max(5, Math.ceil(dueCount / 3)));

  // Deduplicate: build a map to avoid the same word appearing twice
  const wordMap = new Map();

  // priority 1: due reviews
  for (const v of dueReviews) wordMap.set(v.id, v);

  // priority 2: unresolved error words (if not already included)
  for (const v of errorWords) {
    if (!wordMap.has(v.id)) wordMap.set(v.id, v);
  }

  // priority 3: 用户点词队列（主动想学的词优先于排期新词，上限 3 个/天）
  let userAdded = 0;
  for (const v of userQueueWords) {
    if (userAdded >= 3) break;
    if (!wordMap.has(v.id)) {
      wordMap.set(v.id, v);
      userAdded++;
    }
  }

  // priority 4: new words (up to newMax, and respect total cap of 20)
  let newAdded = 0;
  for (const v of newWords) {
    if (newAdded >= newMax) break;
    if (!wordMap.has(v.id)) {
      wordMap.set(v.id, v);
      newAdded++;
    }
  }

  let result = Array.from(wordMap.values());

  // total never exceeds 16; sustainable pace (V3): new 6-10 + reviews/errors
  const MAX_TOTAL = 16;
  const TARGET_MIN = 8;
  const TARGET_MAX = 12;

  if (result.length > MAX_TOTAL) {
    result = result.slice(0, MAX_TOTAL);
  }

  // If we still have room and are below target, fill with more new words
  if (result.length < TARGET_MIN) {
    for (const v of newWords) {
      if (result.length >= TARGET_MAX) break;
      if (!wordMap.has(v.id)) {
        result.push(v);
        wordMap.set(v.id, v);
      }
    }
  }

  return result;
}

// ---------------------------------------------------------------------------
// 3. Entry Points
// ---------------------------------------------------------------------------

/**
 * Start a new vocab learning session for the given day.
 * Called from Today page or vocab card.
 */
async function startVocabSession(day) {
  try {
    const words = await getDailyVocabWords(day);

    if (!words || words.length === 0) {
      showToast('暂无可学习的单词');
      navTo('today');
      return;
    }

    await _preloadMasteryCache(words); // V4：en2cn 首触判定需要

    vocabSession = {
      day: day,
      phase: 'precheck',
      targetWords: words,
      precheckResults: {},
      learnWords: [],
      quizQueue: [],
      quizIdx: 0,
      results: [],
      startTime: Date.now()
    };

    const app = document.getElementById('app');
    renderVocabPrecheck(app);
  } catch (e) {
    console.error('[vocab] startVocabSession error', e);
    showToast('启动单词学习失败，请重试');
    navTo('today');
  }
}

/**
 * Start a retry session for specific vocab IDs (from error bank).
 */
async function startVocabRetry(vocabIds) {
  try {
    if (!vocabIds || vocabIds.length === 0) {
      showToast('没有需要重练的单词');
      return;
    }

    const words = vocabIds
      .map(id => VOCAB_ITEMS.find(v => v.id === id))
      .filter(Boolean);

    if (words.length === 0) {
      showToast('未找到对应单词');
      return;
    }

    await _preloadMasteryCache(words); // V4：en2cn 首触判定需要

    vocabSession = {
      day: 0,
      phase: 'quiz',
      targetWords: words,
      precheckResults: {},
      learnWords: [],   // skip learn phase for retry
      quizQueue: [],
      quizIdx: 0,
      results: [],
      startTime: Date.now(),
      isRetry: true
    };

    // build quiz queue directly
    buildQuizQueue(words);

    const app = document.getElementById('app');
    if (vocabSession.quizQueue.length > 0) {
      renderVocabQuiz(app);
    } else {
      showToast('没有可生成的测验题');
      navTo('today');
    }
  } catch (e) {
    console.error('[vocab] startVocabRetry error', e);
    showToast('启动重练失败，请重试');
    navTo('today');
  }
}

// ---------------------------------------------------------------------------
// 4. Session Flow Bar
// ---------------------------------------------------------------------------

function _renderVocabFlowBar(currentPhase) {
  const steps = [
    { key: 'precheck', label: '预习' },
    { key: 'learn', label: '学习' },
    { key: 'quiz', label: '测验' },
    { key: 'summary', label: '总结' }
  ];
  const currentIdx = steps.findIndex(s => s.key === currentPhase);

  let html = '<div class="session-flow-bar">';
  steps.forEach((step, i) => {
    const cls = i < currentIdx ? 'done' : (i === currentIdx ? 'active' : '');
    html += `<div class="session-flow-step ${cls}">`;
    html += `<div class="session-flow-dot"></div>`;
    html += `<span>${step.label}</span>`;
    if (i < steps.length - 1) html += '<span class="session-flow-arrow">→</span>';
    html += '</div>';
  });
  html += '<button class="btn btn-ghost btn-sm" style="margin-left:auto;" onclick="navTo(\'today\')">退出</button>';
  html += '</div>';
  return html;
}

// ---------------------------------------------------------------------------
// 5. Pre-check Phase
// ---------------------------------------------------------------------------

function renderVocabPrecheck(app) {
  if (!vocabSession) { navTo('today'); return; }
  vocabSession.phase = 'precheck';

  const words = vocabSession.targetWords;
  const results = vocabSession.precheckResults;
  const ratedCount = Object.keys(results).length;

  app.innerHTML = `
    <div class="container page">
      ${_renderVocabFlowBar('precheck')}
      <div style="padding: 16px 0 8px;">
        <div class="flex items-center justify-between">
          <h2>单词预习</h2>
          <span class="badge badge-primary">${ratedCount} / ${words.length}</span>
        </div>
        <p class="text-secondary text-sm mt-sm">对每个单词选择你的熟悉程度</p>
      </div>

      <div id="vocab-precheck-list">
        ${words.map(v => _renderPrecheckItem(v, results[v.id])).join('')}
      </div>

      <div style="padding: 16px 0 32px;">
        <button id="vocab-precheck-next" class="btn btn-primary" style="width:100%;"
          ${ratedCount < words.length ? 'disabled' : ''}
          onclick="proceedToLearn()">
          ${ratedCount < words.length ? `还需评估 ${words.length - ratedCount} 个` : '开始学习'}
        </button>
      </div>
    </div>
  `;
}

function _renderPrecheckItem(v, currentRating) {
  const knownSel = currentRating === 'known' ? 'selected' : '';
  const unsureSel = currentRating === 'unsure' ? 'selected' : '';
  const unknownSel = currentRating === 'unknown' ? 'selected' : '';

  return `
    <div class="vocab-precheck-item" id="precheck-${v.id}">
      <div>
        <div class="word-en">${v.word}</div>
        <div class="word-cn">${v.chinese}</div>
      </div>
      <div class="vocab-precheck-btns">
        <button class="vocab-precheck-btn known ${knownSel}"
          onclick="ratePrecheckWord('${v.id}', 'known')">认识</button>
        <button class="vocab-precheck-btn unsure ${unsureSel}"
          onclick="ratePrecheckWord('${v.id}', 'unsure')">不确定</button>
        <button class="vocab-precheck-btn unknown ${unknownSel}"
          onclick="ratePrecheckWord('${v.id}', 'unknown')">不认识</button>
      </div>
    </div>
  `;
}

function ratePrecheckWord(vocabId, rating) {
  if (!vocabSession) return;
  vocabSession.precheckResults[vocabId] = rating;

  // Update only the changed item for smoothness
  const v = vocabSession.targetWords.find(w => w.id === vocabId);
  if (!v) return;

  const container = document.getElementById(`precheck-${vocabId}`);
  if (container) {
    const knownSel = rating === 'known' ? 'selected' : '';
    const unsureSel = rating === 'unsure' ? 'selected' : '';
    const unknownSel = rating === 'unknown' ? 'selected' : '';
    container.querySelector('.vocab-precheck-btns').innerHTML = `
      <button class="vocab-precheck-btn known ${knownSel}"
        onclick="ratePrecheckWord('${v.id}', 'known')">认识</button>
      <button class="vocab-precheck-btn unsure ${unsureSel}"
        onclick="ratePrecheckWord('${v.id}', 'unsure')">不确定</button>
      <button class="vocab-precheck-btn unknown ${unknownSel}"
        onclick="ratePrecheckWord('${v.id}', 'unknown')">不认识</button>
    `;
  }

  // Update progress badge and button
  const ratedCount = Object.keys(vocabSession.precheckResults).length;
  const total = vocabSession.targetWords.length;

  const nextBtn = document.getElementById('vocab-precheck-next');
  if (nextBtn) {
    if (ratedCount >= total) {
      nextBtn.disabled = false;
      nextBtn.textContent = '开始学习';
    } else {
      nextBtn.disabled = true;
      nextBtn.textContent = `还需评估 ${total - ratedCount} 个`;
    }
  }
}

function proceedToLearn() {
  if (!vocabSession) return;

  // Words marked "known" are skipped; "unsure" and "unknown" go to learn phase
  vocabSession.learnWords = vocabSession.targetWords.filter(v => {
    const r = vocabSession.precheckResults[v.id];
    return r === 'unsure' || r === 'unknown' || !r;
  });

  const app = document.getElementById('app');
  if (vocabSession.learnWords.length === 0) {
    // All known — skip straight to quiz
    buildQuizQueue(vocabSession.targetWords);
    if (vocabSession.quizQueue.length > 0) {
      renderVocabQuiz(app);
    } else {
      renderVocabSummary(app);
    }
  } else {
    renderVocabLearn(app);
  }
}

// ---------------------------------------------------------------------------
// 6. Learn Phase
// ---------------------------------------------------------------------------

function renderVocabLearn(app) {
  if (!vocabSession) { navTo('today'); return; }
  vocabSession.phase = 'learn';

  if (!vocabSession._learnIdx) vocabSession._learnIdx = 0;

  const words = vocabSession.learnWords;
  const idx = vocabSession._learnIdx;

  if (idx >= words.length) {
    // All cards reviewed — move to quiz
    buildQuizQueue(vocabSession.targetWords);
    if (vocabSession.quizQueue.length > 0) {
      renderVocabQuiz(app);
    } else {
      renderVocabSummary(app);
    }
    return;
  }

  const v = words[idx];
  _noteExposureAsync(v.id); // V4：查看学习卡片 = 一次真实接触
  const confusableHTML = (v.confusable && v.confusable.length > 0) ? `
    <div class="word-confusable">
      <div class="word-confusable-label">⚠️ 易混淆</div>
      ${v.confusable.map(c => `<div class="word-confusable-item"><strong>${c.word}</strong> — ${c.diff}</div>`).join('')}
    </div>
  ` : '';

  const collocationsHTML = (v.collocations && v.collocations.length > 0) ? `
    <div class="word-collocations">
      <div class="word-collocations-label">搭配</div>
      ${v.collocations.map(c => `<span class="word-colloc-chip">${c}</span>`).join('')}
    </div>
  ` : '';

  app.innerHTML = `
    <div class="container page">
      ${_renderVocabFlowBar('learn')}
      <div style="padding: 16px 0 8px;">
        <div class="flex items-center justify-between">
          <h2>学习单词</h2>
          <span class="badge badge-primary">${idx + 1} / ${words.length}</span>
        </div>
      </div>

      <div class="vocab-card">
        <div>
          <span class="word-title">${v.word}</span>
          <span class="word-pos">${v.pos}</span>
        </div>
        <div class="word-cn">${v.chinese}</div>
        <div class="word-work-meaning">${v.work_meaning || ''}</div>

        <div class="word-example">${_glossify(v.example_en || '')}</div>
        <div class="word-example-cn">${v.example_cn || ''}</div>

        ${collocationsHTML}
        ${confusableHTML}

        <div class="flex gap-sm mt-md">
          <button class="btn btn-ghost btn-sm flex-1" onclick="playVocabWord('${v.id}')">
            🔊 播放
          </button>
        </div>
      </div>

      <div style="padding: 8px 0 32px;">
        <button class="btn btn-primary" style="width:100%;" onclick="nextVocabLearn()">
          ${idx + 1 < words.length ? '下一个' : '开始测验'}
        </button>
      </div>
    </div>
  `;
}

function playVocabWord(vocabId) {
  const v = VOCAB_ITEMS.find(item => item.id === vocabId);
  if (!v) return;
  try {
    if (typeof SpeechUtils !== 'undefined' && SpeechUtils.speak) {
      SpeechUtils.speak(v.word, { rate: 0.9 });
    }
  } catch (e) {
    console.warn('[vocab] TTS failed', e);
  }
}

function nextVocabLearn() {
  if (!vocabSession) return;
  vocabSession._learnIdx = (vocabSession._learnIdx || 0) + 1;
  const app = document.getElementById('app');
  renderVocabLearn(app);
}

// ---------------------------------------------------------------------------
// 7. Quiz Generation — 6 quiz types
// ---------------------------------------------------------------------------

/**
 * V4：会话开始时把目标词的 mastery 记录预载进 _masteryCache，
 * 使 _canGenerateQuiz（同步）能做"en2cn 仅首触词可用"的判定。
 */
async function _preloadMasteryCache(words) {
  for (const v of words) {
    if (_masteryCache.has(v.id)) continue;
    try {
      const m = await dbGet(STORES.masteryRecords, v.id);
      if (m) _masteryCache.set(v.id, m);
    } catch (e) { /* 无记录即新词，跳过 */ }
  }
}

/**
 * V4：学习卡片查看等非答题接触，记一次 exposure（异步、静默失败）。
 */
async function _noteExposureAsync(vocabId) {
  try {
    let m = _masteryCache.get(vocabId);
    if (!m) {
      try { m = await dbGet(STORES.masteryRecords, vocabId); } catch (e) { m = null; }
      if (!m) m = WEC_Algo.initMastery(vocabId);
    }
    m = WEC_Algo.noteExposure(m);
    // 查看接触可能让状态从 New 进入 Learning，但不影响排期
    if (m.mastery_state === 'New') m.mastery_state = 'Learning';
    _masteryCache.set(vocabId, m);
    await dbPut(STORES.masteryRecords, m);
  } catch (e) { /* non-critical */ }
}

/**
 * V4：点词释义包装（gloss.js 提供 Gloss.glossify；未加载时原样返回）。
 */
function _glossify(text) {
  if (typeof Gloss !== 'undefined' && Gloss.glossify) return Gloss.glossify(text);
  return String(text == null ? '' : text);
}

/**
 * Build the quiz queue: one quiz item per target word, type chosen randomly.
 */
function buildQuizQueue(words) {
  vocabSession.quizQueue = [];
  vocabSession.quizIdx = 0;

  // V4：删除 scenario（无语境裸问"哪个词适合此场景"，违背语境学习原则）
  // 新增 contextchoice（完整例句 + 中文句意支撑的语境选词）
  // 顺序即优先级倾向：主动回忆类在前，识别类(en2cn)仅首触词可用（见 _canGenerateQuiz）
  const types = ['cn2en', 'fillblank', 'contextchoice', 'firstletter', 'confusable', 'en2cn'];

  for (const v of words) {
    // Filter types that are feasible for this word
    let feasible = types.filter(t => _canGenerateQuiz(t, v));
    if (feasible.length === 0) feasible = ['cn2en']; // fallback：主动回忆保底

    // Pick a random feasible type
    const qType = feasible[Math.floor(Math.random() * feasible.length)];
    const quizItem = _generateQuiz(qType, v);
    if (quizItem) vocabSession.quizQueue.push(quizItem);
  }

  // Shuffle quiz order for variety
  for (let i = vocabSession.quizQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [vocabSession.quizQueue[i], vocabSession.quizQueue[j]] =
      [vocabSession.quizQueue[j], vocabSession.quizQueue[i]];
  }
}

function _canGenerateQuiz(type, v) {
  switch (type) {
    case 'en2cn': {
      // V4：看词选义（再认）只能做初筛 —— 仅首触词可用
      // 首触 = 接触 <= 1 次 或 从未作答过；之后必须主动回忆
      if (!v.word || !v.chinese) return false;
      const m = _masteryCache.get(v.id);
      const exposures = m ? (m.exposure_count || 0) : 0;
      const reviews = m ? (m.review_count || 0) : 0;
      return exposures <= 1 || reviews === 0;
    }
    case 'cn2en':
      return !!v.word && !!v.chinese;
    case 'fillblank':
      return !!v.example_en && v.example_en.length > 10;
    case 'contextchoice': {
      // 需要例句中确实出现该词（才能挖空）
      if (!v.example_en || v.example_en.length <= 10) return false;
      const wordRegex = new RegExp('\\b' + _escapeRegex(v.word) + '\\b', 'i');
      if (wordRegex.test(v.example_en)) return true;
      const lemmaRegex = new RegExp('\\b' + _escapeRegex(v.lemma || v.word) + '\\b', 'i');
      return lemmaRegex.test(v.example_en);
    }
    case 'firstletter':
      return !!v.word && v.word.length > 1;
    case 'confusable':
      return v.confusable && v.confusable.length >= 1;
    default:
      return false;
  }
}

/**
 * Get 3 distractor options from other vocab items (same pos preferred).
 */
function _getDistractors(v, field, count) {
  const pool = VOCAB_ITEMS.filter(item =>
    item.id !== v.id && item[field] && item[field] !== v[field]
  );
  // Prefer same pos
  const samePos = pool.filter(item => item.pos === v.pos);
  const chosen = [];
  const usedValues = new Set([v[field]]);
  const tryPick = (arr) => {
    for (const item of arr) {
      if (chosen.length >= count) break;
      if (!usedValues.has(item[field])) {
        chosen.push(item);
        usedValues.add(item[field]);
      }
    }
  };
  tryPick(samePos);
  if (chosen.length < count) tryPick(pool);
  // If still not enough, just take what we have
  return chosen;
}

function _shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function _generateQuiz(type, v) {
  switch (type) {
    case 'en2cn':
      return _genEn2Cn(v);
    case 'cn2en':
      return _genCn2En(v);
    case 'fillblank':
      return _genFillBlank(v);
    case 'contextchoice':
      return _genContextChoice(v);
    case 'firstletter':
      return _genFirstLetter(v);
    case 'confusable':
      return _genConfusable(v);
    default:
      // 含旧数据中的 'scenario'：一律回退到语境选词/填空，绝不返回 null 崩溃
      return _genContextChoice(v) || _genFillBlank(v) || _genCn2En(v);
  }
}

// --- a) English -> Chinese (Recognition) ---
function _genEn2Cn(v) {
  const distractors = _getDistractors(v, 'chinese', 3);
  if (distractors.length < 3) return _genCn2En(v); // fallback

  const options = _shuffleArray([
    { text: v.chinese, correct: true },
    ...distractors.map(d => ({ text: d.chinese, correct: false }))
  ]);
  const correctIdx = options.findIndex(o => o.correct);

  return {
    type: 'en2cn',
    quizType: 'choice',
    dimension: 'recognition',
    vocabId: v.id,
    word: v.word,
    question: v.word,
    questionLabel: '选出正确的中文释义',
    options: options.map(o => o.text),
    correctIdx: correctIdx,
    correctAnswer: v.chinese,
    acceptableAnswers: v.acceptable_answers || [v.word],
    item: v
  };
}

// --- b) Chinese -> English (Recall) ---
function _genCn2En(v) {
  const distractors = _getDistractors(v, 'word', 3);
  if (distractors.length < 3) return _genEn2Cn(v);

  const options = _shuffleArray([
    { text: v.word, correct: true },
    ...distractors.map(d => ({ text: d.word, correct: false }))
  ]);
  const correctIdx = options.findIndex(o => o.correct);

  return {
    type: 'cn2en',
    quizType: 'choice',
    dimension: 'recall',
    vocabId: v.id,
    word: v.word,
    question: v.chinese,
    questionLabel: '选出正确的英文单词',
    options: options.map(o => o.text),
    correctIdx: correctIdx,
    correctAnswer: v.word,
    acceptableAnswers: v.acceptable_answers || [v.word],
    item: v
  };
}

// --- c) Fill-in-blank (Usage) ---
function _genFillBlank(v) {
  const sentence = v.example_en;
  // Build a case-insensitive regex to blank out the word
  const wordRegex = new RegExp('\\b' + _escapeRegex(v.word) + '\\b', 'i');
  let blankedSentence;
  if (wordRegex.test(sentence)) {
    blankedSentence = sentence.replace(wordRegex, '____');
  } else {
    // Try lemma
    const lemmaRegex = new RegExp('\\b' + _escapeRegex(v.lemma || v.word) + '\\b', 'i');
    blankedSentence = lemmaRegex.test(sentence)
      ? sentence.replace(lemmaRegex, '____')
      : sentence.replace(/\S+$/, '____');
  }

  const distractors = _getDistractors(v, 'word', 3);
  if (distractors.length < 3) return _genEn2Cn(v);

  const options = _shuffleArray([
    { text: v.word, correct: true },
    ...distractors.map(d => ({ text: d.word, correct: false }))
  ]);
  const correctIdx = options.findIndex(o => o.correct);

  return {
    type: 'fillblank',
    quizType: 'choice',
    dimension: 'usage',
    vocabId: v.id,
    word: v.word,
    question: blankedSentence,
    questionLabel: '选择正确的单词填入空格',
    options: options.map(o => o.text),
    correctIdx: correctIdx,
    correctAnswer: v.word,
    acceptableAnswers: v.acceptable_answers || [v.word],
    item: v
  };
}

// --- d) First letter input (Recall) ---
function _genFirstLetter(v) {
  const firstLetter = v.word.charAt(0).toUpperCase();
  const wordLen = v.word.length;

  return {
    type: 'firstletter',
    quizType: 'input',
    dimension: 'recall',
    vocabId: v.id,
    word: v.word,
    question: `${v.chinese} (${firstLetter}___, ${wordLen} 个字母)`,
    questionLabel: '拼写完整的英文单词',
    correctAnswer: v.word,
    acceptableAnswers: v.acceptable_answers || [v.word],
    item: v
  };
}

// --- e) Confusable distinction (Usage) ---
function _genConfusable(v) {
  if (!v.confusable || v.confusable.length === 0) return _genEn2Cn(v);

  // Take 1-2 confusable words, mix with the correct word
  const confusableWords = v.confusable.slice(0, 2).map(c => c.word);
  const allOptions = [v.word, ...confusableWords];
  const shuffled = _shuffleArray(allOptions);
  const correctIdx = shuffled.indexOf(v.word);

  // Ask which word means the work_meaning
  return {
    type: 'confusable',
    quizType: 'choice',
    dimension: 'usage',
    vocabId: v.id,
    word: v.word,
    question: `下列哪个词表示「${v.work_meaning || v.chinese}」？`,
    questionLabel: '易混词辨析',
    options: shuffled,
    correctIdx: correctIdx,
    correctAnswer: v.word,
    acceptableAnswers: v.acceptable_answers || [v.word],
    item: v
  };
}

// --- f) Context choice (Usage) — V4 新增，取代旧 scenario 题 ---
// 与 fillblank 的区别：给出完整英文例句（挖空）+ 中文句意支撑，
// 考"在理解语境的前提下选出最贴切的词"，是可理解输入(i+1)下的语境学习；
// fillblank 则不提供中文，纯靠英文语境推断。
function _genContextChoice(v) {
  const sentence = v.example_en;
  if (!sentence) return null;

  // 挖空目标词（找不到则尝试 lemma，再找不到此题不可生成）
  const wordRegex = new RegExp('\\b' + _escapeRegex(v.word) + '\\b', 'i');
  let blankedSentence;
  if (wordRegex.test(sentence)) {
    blankedSentence = sentence.replace(wordRegex, '____');
  } else {
    const lemmaRegex = new RegExp('\\b' + _escapeRegex(v.lemma || v.word) + '\\b', 'i');
    if (!lemmaRegex.test(sentence)) return null;
    blankedSentence = sentence.replace(lemmaRegex, '____');
  }

  const distractors = _getDistractors(v, 'word', 3);
  if (distractors.length < 3) return null;

  const options = _shuffleArray([
    { text: v.word, correct: true },
    ...distractors.map(d => ({ text: d.word, correct: false }))
  ]);
  const correctIdx = options.findIndex(o => o.correct);

  return {
    type: 'contextchoice',
    quizType: 'choice',
    dimension: 'usage',
    vocabId: v.id,
    word: v.word,
    question: blankedSentence,
    questionSub: v.example_cn || '',   // 中文句意支撑，渲染在题干下方
    questionLabel: '语境选词 · 哪个词最符合句意',
    options: options.map(o => o.text),
    correctIdx: correctIdx,
    correctAnswer: v.word,
    acceptableAnswers: v.acceptable_answers || [v.word],
    item: v
  };
}

function _escapeRegex(str) {
  return String(str || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// ---------------------------------------------------------------------------
// 8. Quiz Rendering
// ---------------------------------------------------------------------------

function renderVocabQuiz(app) {
  if (!vocabSession) { navTo('today'); return; }
  vocabSession.phase = 'quiz';

  const queue = vocabSession.quizQueue;
  const idx = vocabSession.quizIdx;

  if (idx >= queue.length) {
    renderVocabSummary(app);
    return;
  }

  const q = queue[idx];
  q.shownAt = Date.now(); // V4：反应时计时起点（动态调度输入之一）
  let questionBody = '';

  if (q.quizType === 'choice') {
    questionBody = `
      <div id="vocab-quiz-options">
        ${q.options.map((opt, i) => `
          <button class="vocab-quiz-option" data-idx="${i}"
            onclick="answerVocabChoice(${i})">${opt}</button>
        `).join('')}
      </div>
    `;
  } else if (q.quizType === 'input') {
    questionBody = `
      <div style="margin-top:12px;">
        <input type="text" id="vocab-quiz-input"
          placeholder="输入英文单词..."
          autocomplete="off" autocapitalize="off" spellcheck="false"
          style="width:100%; padding:14px 16px; font-size:16px; border:2px solid var(--color-border-light); border-radius:var(--radius-md); box-sizing:border-box;"
          onkeypress="if(event.key==='Enter') submitVocabInput()" />
        <button class="btn btn-primary" style="width:100%; margin-top:8px;"
          onclick="submitVocabInput()">提交</button>
      </div>
    `;
  }

  app.innerHTML = `
    <div class="container page">
      ${_renderVocabFlowBar('quiz')}
      <div style="padding: 16px 0 8px;">
        <div class="flex items-center justify-between">
          <h2>单词测验</h2>
          <span class="badge badge-primary">${idx + 1} / ${queue.length}</span>
        </div>
      </div>

      <div class="card">
        <div class="text-secondary text-sm">${q.questionLabel}</div>
        <div style="font-size:18px; font-weight:600; padding:14px 0 4px; line-height:1.6;">${q.question}</div>
        ${q.questionSub ? `<div class="text-secondary text-sm" style="padding:0 0 10px; line-height:1.5;">${q.questionSub}</div>` : ''}
        ${questionBody}
      </div>

      <div id="vocab-quiz-feedback" style="display:none;"></div>
    </div>
  `;

  // Auto-focus input
  if (q.quizType === 'input') {
    setTimeout(() => {
      const input = document.getElementById('vocab-quiz-input');
      if (input) input.focus();
    }, 100);
  }
}

// ---------------------------------------------------------------------------

let _vocabAnswered = false;

function answerVocabChoice(selectedIdx) {
  if (!vocabSession || _vocabAnswered) return;
  _vocabAnswered = true;

  const q = vocabSession.quizQueue[vocabSession.quizIdx];
  const isCorrect = selectedIdx === q.correctIdx;
  const rt = q.shownAt ? (Date.now() - q.shownAt) : 0; // V4 反应时

  // Highlight options
  const optionContainer = document.getElementById('vocab-quiz-options');
  if (optionContainer) {
    const btns = optionContainer.querySelectorAll('.vocab-quiz-option');
    btns.forEach((btn, i) => {
      btn.classList.add('disabled');
      if (i === q.correctIdx) btn.classList.add('correct');
      else if (i === selectedIdx) btn.classList.add('incorrect');
    });
  }

  _showVocabFeedback(q, isCorrect, q.options[selectedIdx], null, rt);
}

function submitVocabInput() {
  if (!vocabSession || _vocabAnswered) return;
  _vocabAnswered = true;

  const q = vocabSession.quizQueue[vocabSession.quizIdx];
  const input = document.getElementById('vocab-quiz-input');
  const userInput = input ? input.value : '';
  const rt = q.shownAt ? (Date.now() - q.shownAt) : 0; // V4 反应时

  const isCorrect = _checkInputAnswer(userInput, q);

  // Disable input
  if (input) input.disabled = true;
  const submitBtn = input ? input.nextElementSibling : null;
  if (submitBtn) submitBtn.disabled = true;

  _showVocabFeedback(q, isCorrect, userInput, null, rt);
}

/**
 * Deterministic answer checking for input questions.
 * Case-insensitive, strips punctuation, checks acceptable_answers + variants.
 */
function _checkInputAnswer(userInput, q) {
  const normalize = (s) => {
    return String(s || '')
      .toLowerCase()
      .trim()
      .replace(/[.,!?;:'"]/g, '')
      .replace(/\s+/g, ' ');
  };

  const normalized = normalize(userInput);
  if (!normalized) return false;

  // Collect all acceptable answers
  const acceptable = new Set();
  if (q.correctAnswer) acceptable.add(normalize(q.correctAnswer));
  if (q.acceptableAnswers) {
    q.acceptableAnswers.forEach(a => acceptable.add(normalize(a)));
  }
  // Add the word itself and lemma
  if (q.item) {
    acceptable.add(normalize(q.item.word));
    if (q.item.lemma) acceptable.add(normalize(q.item.lemma));
  }

  // Direct match
  if (acceptable.has(normalized)) return true;

  // Check common spelling variants (allow 1-character difference for longer words)
  for (const ans of acceptable) {
    if (_isSpellingVariant(normalized, ans)) return true;
  }

  return false;
}

/**
 * Check if two strings differ by at most 1 character (insert/delete/substitute)
 * Only for words of length >= 4 to avoid false positives on short words.
 */
function _isSpellingVariant(a, b) {
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  if (a.length < 4 || b.length < 4) return a === b;

  // Levenshtein distance == 1
  const dist = _levenshtein(a, b);
  return dist <= 1;
}

function _levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = [];
  for (let i = 0; i <= m; i++) {
    dp[i] = [i];
    for (let j = 1; j <= n; j++) {
      if (i === 0) { dp[i][j] = j; continue; }
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1,
        dp[i - 1][j - 1] + cost
      );
    }
  }
  return dp[m][n];
}
