// 10. Feedback + Error Analysis Card
// ---------------------------------------------------------------------------

function _showVocabFeedback(q, isCorrect, userAnswer, hintUsed, responseTime) {
  const feedback = document.getElementById('vocab-quiz-feedback');
  if (!feedback) return;

  // Record result
  const result = {
    vocabId: q.vocabId,
    word: q.word,
    quizType: q.type,
    dimension: q.dimension,
    isCorrect: isCorrect,
    userAnswer: userAnswer,
    correctAnswer: q.correctAnswer,
    hintUsed: !!hintUsed,
    responseTime: responseTime || 0,
    timestamp: Date.now()
  };
  vocabSession.results.push(result);

  // Update mastery and record error if wrong
  updateVocabMastery(q, isCorrect, hintUsed, responseTime || 0);
  if (!isCorrect || hintUsed) {
    recordVocabError(q, userAnswer, isCorrect, hintUsed);
  }

  // Build error analysis card
  const bgClass = isCorrect ? 'correct-bg' : 'incorrect-bg';
  const statusText = isCorrect ? '✓ 回答正确' : '✗ 回答错误';
  const statusColor = isCorrect ? 'text-mint' : 'text-coral';

  const v = q.item;
  const userDisplay = userAnswer || '(未作答)';
  const correctDisplay = q.correctAnswer;

  // Why it's wrong — targeted explanation
  let explanation = '';
  if (!isCorrect) {
    if (q.type === 'en2cn') {
      explanation = `「${v.word}」的中文释义是「${v.chinese}」，不是「${userDisplay}」。注意区分相近的中文含义。`;
    } else if (q.type === 'cn2en') {
      explanation = `「${v.chinese}」对应的英文是「${v.word}」，不是「${userDisplay}」。请回忆这个词的拼写。`;
    } else if (q.type === 'fillblank') {
      explanation = `在例句中应该填入「${v.word}」。该词在此语境下表示「${v.work_meaning || v.chinese}」。`;
    } else if (q.type === 'contextchoice') {
      explanation = `结合句意「${v.example_cn || v.chinese}」，空格处应填「${v.word}」。该词在此语境下表示「${v.work_meaning || v.chinese}」。`;
    } else if (q.type === 'firstletter') {
      explanation = `正确的拼写是「${v.word}」。${v.word.length} 个字母，首字母 ${v.word.charAt(0).toUpperCase()}。`;
    } else if (q.type === 'confusable') {
      explanation = `「${v.word}」表示「${v.work_meaning || v.chinese}」。${v.confusable ? v.confusable.map(c => `「${c.word}」${c.diff}`).join('；') : ''}`;
    } else {
      explanation = `正确答案是「${q.correctAnswer}」。`;
    }
  } else {
    explanation = `回答正确！「${v.word}」= ${v.chinese}。${v.work_meaning || ''}`;
  }

  // Confusable distinction section
  const confusableSection = (v.confusable && v.confusable.length > 0) ? `
    <div class="ea-label">易混淆辨析</div>
    <div class="ea-value">
      ${v.confusable.map(c => `<div><strong>${c.word}</strong> — ${c.diff}</div>`).join('')}
    </div>
  ` : '';

  // Related expression
  const relatedSection = v.related_expression ? `
    <div class="ea-label">相关表达</div>
    <div class="ea-value">${v.related_expression}</div>
  ` : '';

  // Work example（V4：例句支持点词查义）
  const exampleSection = v.example_en ? `
    <div class="ea-label">工作例句</div>
    <div class="ea-value">
      <div>${_glossify(v.example_en)}</div>
      <div class="text-light text-xs mt-sm">${v.example_cn || ''}</div>
    </div>
  ` : '';

  // Next review time
  let nextReviewText = '明天复习';
  try {
    const mastery = _masteryCache.get(v.id);
    if (mastery && mastery.next_review_at) {
      const days = Math.max(0, Math.round((mastery.next_review_at - Date.now()) / 86400000));
      nextReviewText = days === 0 ? '今天复习' : days === 1 ? '明天复习' : `${days} 天后复习`;
    }
  } catch (e) {}

  feedback.style.display = 'block';
  feedback.innerHTML = `
    <div class="card">
      <div style="padding:12px 0;">
        <div style="font-size:18px; font-weight:700; color:${isCorrect ? 'var(--color-primary)' : 'var(--color-coral)'};">
          ${statusText}
        </div>
      </div>

      <div class="error-analysis ${bgClass}">
        <div class="ea-label">你的回答</div>
        <div class="ea-value">${userDisplay}</div>

        <div class="ea-label">正确答案</div>
        <div class="ea-value" style="font-weight:600; color:var(--color-primary);">${correctDisplay}</div>

        <div class="ea-label">${isCorrect ? '解析' : '为什么错了'}</div>
        <div class="ea-explanation">${explanation}</div>

        ${exampleSection}
        ${confusableSection}
        ${relatedSection}

        <div class="ea-label">下次复习</div>
        <div class="ea-value">${nextReviewText}</div>
      </div>

      <div style="margin-top:12px;">
        <button class="btn btn-primary" style="width:100%;"
          onclick="nextVocabQuiz()">
          ${vocabSession.quizIdx + 1 < vocabSession.quizQueue.length ? '下一题' : '查看总结'}
        </button>
      </div>
    </div>
  `;

  // Scroll to feedback
  setTimeout(() => {
    feedback.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

function nextVocabQuiz() {
  if (!vocabSession) return;
  _vocabAnswered = false;
  vocabSession.quizIdx++;
  const app = document.getElementById('app');
  renderVocabQuiz(app);
}

// ---------------------------------------------------------------------------
// 11. Error Recording
// ---------------------------------------------------------------------------

// In-memory cache for mastery records (avoids repeated DB reads during a session)
const _masteryCache = new Map();

async function recordVocabError(q, userAnswer, isCorrect, hintUsed) {
  try {
    const v = q.item || VOCAB_ITEMS.find(item => item.id === q.vocabId);
    if (!v) return;

    // Check if an existing error record for same vocab_id + same error_type exists
    const allErrors = await dbGetAll(STORES.errorBank);
    const existing = allErrors.find(e =>
      e.vocab_id === v.id && e.error_type === q.type
    );

    // Build explanation
    let explanation = '';
    if (q.type === 'en2cn') {
      explanation = `「${v.word}」的中文是「${v.chinese}」。用户选择了「${userAnswer}」。`;
    } else if (q.type === 'cn2en') {
      explanation = `「${v.chinese}」对应英文「${v.word}」。用户选择了「${userAnswer}」。`;
    } else if (q.type === 'fillblank') {
      explanation = `例句填空应填「${v.word}」。用户选择了「${userAnswer}」。`;
    } else if (q.type === 'firstletter') {
      explanation = `首字母填空正确答案「${v.word}」。用户输入了「${userAnswer}」。`;
    } else if (q.type === 'confusable') {
      explanation = `易混词辨析：正确答案「${v.word}」(${v.chinese})。用户选择了「${userAnswer}」。${v.confusable ? v.confusable.map(c => c.word + ': ' + c.diff).join('; ') : ''}`;
    } else if (q.type === 'contextchoice') {
      explanation = `语境选词正确答案「${v.word}」（${v.work_meaning || v.chinese}）。用户选择了「${userAnswer}」。`;
    }

    // Determine error tag
    let errorTag = 'vocabulary';
    if (q.type === 'firstletter') errorTag = 'spelling';
    else if (q.type === 'confusable') errorTag = 'confusable';
    else if (q.type === 'fillblank') errorTag = 'usage';
    else if (q.type === 'contextchoice') errorTag = 'usage';
    else if (q.type === 'en2cn') errorTag = 'recognition';
    else if (q.type === 'cn2en') errorTag = 'recall';

    const userSelectedOption = (q.quizType === 'choice' && typeof userAnswer === 'string')
      ? userAnswer : null;

    if (existing) {
      // Increment occurrence, update fields
      existing.occurrence_count = (existing.occurrence_count || 0) + 1;
      existing.last_seen_at = new Date().toISOString();
      existing.resolved = false;
      existing.resolve_streak = 0;
      existing.user_answer = userAnswer;
      if (userSelectedOption) existing.user_selected_option = userSelectedOption;
      existing.question = q.question;
      existing.explanation = explanation;
      existing.hint_used = !!hintUsed;
      existing.answer_revealed = !!hintUsed;
      existing.next_review_at = Date.now() + 86400000;
      existing.updated_at = new Date().toISOString();
      await dbPut(STORES.errorBank, existing);
    } else {
      // Create new error record
      const errorRecord = {
        id: uuid(),
        vocab_id: v.id,
        word: v.word,
        error_type: q.type,
        quiz_type: q.type,
        question: q.question,
        user_answer: userAnswer,
        user_selected_option: userSelectedOption,
        correct_answer: q.correctAnswer,
        acceptable_answers: v.acceptable_answers || [v.word],
        explanation: explanation,
        error_tag: errorTag,
        work_context: v.work_context || '',
        hint_used: !!hintUsed,
        answer_revealed: !!hintUsed,
        occurrence_count: 1,
        first_seen_at: new Date().toISOString(),
        last_seen_at: new Date().toISOString(),
        next_review_at: Date.now() + 86400000,
        resolved: false,
        resolve_streak: 0,
        learning_item_id: v.id,
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      };
      await dbPut(STORES.errorBank, errorRecord);
    }
  } catch (e) {
    console.warn('[vocab] recordVocabError failed', e);
  }
}

// ---------------------------------------------------------------------------
// 12. Mastery Update
// ---------------------------------------------------------------------------

async function updateVocabMastery(q, isCorrect, hintUsed, responseTime) {
  try {
    const v = q.item || VOCAB_ITEMS.find(item => item.id === q.vocabId);
    if (!v) return;

    // Get or create mastery record
    let mastery = _masteryCache.get(v.id);
    if (!mastery) {
      try {
        mastery = await dbGet(STORES.masteryRecords, v.id);
      } catch (e) {
        mastery = null;
      }
      if (!mastery) {
        mastery = WEC_Algo.initMastery(v.id);
      }
    }

    // Determine rating
    let rating;
    if (hintUsed) {
      rating = 'hard';  // hint/view-answer counts as "hard", not correct
    } else if (isCorrect) {
      rating = 'good';
    } else {
      rating = 'again';
    }

    // Update mastery using WEC_Algo（V4：传真实反应时，驱动动态调度）
    mastery = WEC_Algo.updateMastery(mastery, rating, {
      dimension: q.dimension,
      hintUsed: !!hintUsed,
      responseTime: responseTime || 0
    });

    // 掌握判定完全由 WEC_Algo.computeMasteryState 负责
    // （接触次数 + 近5次回忆成功率 + 时间沉淀，见 algorithm.js）
    // 仅保留一条业务约束：预习时标"不确定"的词不允许直接判 Mastered
    if (vocabSession && vocabSession.precheckResults[v.id] === 'unsure') {
      if (mastery.mastery_state === 'Mastered') {
        mastery.mastery_state = 'Reviewing';
      }
    }

    // Cache and save
    _masteryCache.set(v.id, mastery);
    await dbPut(STORES.masteryRecords, mastery);

    // V3: also record a lightweight attempt (drives adaptive new-word count + analytics)
    try {
      await dbPut(STORES.learningAttempts, {
        id: uuid(), item_id: v.id, date: todayStr(), timestamp: Date.now(),
        rating, success: rating === 'good' || rating === 'easy',
        dimension: q.dimension || 'recall', quiz_type: q.type || null
      });
    } catch (e) { /* non-critical */ }

    // Update review schedule
    try {
      let schedule = await dbGet(STORES.reviewSchedule, v.id);
      if (!schedule) {
        schedule = {
          item_id: v.id,
          next_review_at: mastery.next_review_at,
          interval_days: mastery.interval_days,
          review_count: mastery.review_count,
          mastery_state: mastery.mastery_state
        };
      } else {
        schedule.next_review_at = mastery.next_review_at;
        schedule.interval_days = mastery.interval_days;
        schedule.review_count = mastery.review_count;
        schedule.mastery_state = mastery.mastery_state;
      }
      await dbPut(STORES.reviewSchedule, schedule);
    } catch (e) {
      console.warn('[vocab] updateVocabMastery: schedule save failed', e);
    }

    // If error is resolved (correct answer after previous errors), mark error as resolved
    if (isCorrect && !hintUsed) {
      try {
        const allErrors = await dbGetAll(STORES.errorBank);
        const wordErrors = allErrors.filter(e => e.vocab_id === v.id && !e.resolved);
        for (const err of wordErrors) {
          err.resolve_streak = (err.resolve_streak || 0) + 1;
          if (err.resolve_streak >= 2) {
            err.resolved = true;
            err.resolved_at = new Date().toISOString();
          }
          err.updated_at = new Date().toISOString();
          await dbPut(STORES.errorBank, err);
        }
      } catch (e) {
        console.warn('[vocab] error resolution update failed', e);
      }
    }
  } catch (e) {
    console.warn('[vocab] updateVocabMastery failed', e);
  }
}

function renderVocabSummary(app) {
  if (!vocabSession) { navTo('today'); return; }
  vocabSession.phase = 'summary';

  const results = vocabSession.results;
  const totalWords = vocabSession.targetWords.length;
  const correctCount = results.filter(r => r.isCorrect).length;
  const errorCount = results.filter(r => !r.isCorrect).length;

  // New words learned = words that went through learn phase
  const newWordsLearned = vocabSession.learnWords ? vocabSession.learnWords.length : 0;

  // Error words for retry
  const errorWords = results.filter(r => !r.isCorrect);

  const accuracy = results.length > 0 ? Math.round(correctCount / results.length * 100) : 100;

  const errorListHTML = errorWords.length > 0 ? `
    <div class="card">
      <div class="text-secondary text-sm mb-md">需要重点复习的单词</div>
      ${errorWords.map(r => {
        const v = VOCAB_ITEMS.find(item => item.id === r.vocabId);
        if (!v) return '';
        return `
          <div class="error-bank-card" style="margin-bottom:8px;">
            <div class="eb-header">
              <span class="eb-word">${v.word}</span>
              <span class="eb-type">${r.quizType}</span>
            </div>
            <div class="eb-detail">正确：${r.correctAnswer} · 你的回答：${r.userAnswer || '(未作答)'}</div>
            <div class="eb-actions">
              <button class="btn btn-ghost btn-sm flex-1"
                onclick="retrySingleVocab('${v.id}')">立即重练</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  ` : '';

  const elapsed = Math.round((Date.now() - vocabSession.startTime) / 60000);

  app.innerHTML = `
    <div class="container page">
      ${_renderVocabFlowBar('summary')}
      <div style="padding: 20px 0; text-align:center;">
        <h2>学习完成</h2>
        <div class="text-secondary text-sm mt-sm">用时 ${elapsed} 分钟</div>
      </div>

      <div class="card" style="text-align:center; padding:24px;">
        <div style="font-size:48px; font-weight:700; color:var(--color-primary);">${accuracy}%</div>
        <div class="text-secondary text-sm mt-sm">正确率</div>
      </div>

      <div class="card">
        <div class="flex justify-between" style="padding:6px 0;">
          <span class="text-secondary text-sm">总单词数</span>
          <span style="font-weight:600;">${totalWords}</span>
        </div>
        <div class="flex justify-between" style="padding:6px 0;">
          <span class="text-secondary text-sm">答对</span>
          <span class="text-mint" style="font-weight:600;">${correctCount}</span>
        </div>
        <div class="flex justify-between" style="padding:6px 0;">
          <span class="text-secondary text-sm">答错</span>
          <span class="text-coral" style="font-weight:600;">${errorCount}</span>
        </div>
        <div class="flex justify-between" style="padding:6px 0;">
          <span class="text-secondary text-sm">新学单词</span>
          <span style="font-weight:600;">${newWordsLearned}</span>
        </div>
      </div>

      ${errorListHTML}

      <div style="padding: 12px 0 32px;">
        <div class="flex gap-md">
          <button class="btn btn-outline flex-1" onclick="navTo('today')">返回 Today</button>
          <button class="btn btn-primary flex-1" onclick="continueVocabAfterSession()">继续学习表达</button>
        </div>
      </div>
    </div>
  `;
}

function retrySingleVocab(vocabId) {
  startVocabRetry([vocabId]);
}

function continueVocabAfterSession() {
  if (!vocabSession) { navTo('today'); return; }
  // Navigate to expression learning or today page based on session
  if (vocabSession.day && vocabSession.day > 0) {
    navTo('learn', { day: vocabSession.day });
  } else {
    navTo('today');
  }
}
