<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a6b4e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Work English Coach</title>
  <style>
/* ===== Work English Coach - Global Styles ===== */

:root {
  /* Color System — V2 视觉系统 */
  --color-primary: #1f5b4a;
  --color-primary-light: #2d8a68;
  --color-primary-dark: #17342c;
  --color-mint: #dce9df;
  --color-mint-light: #e8f3ec;
  --color-coral: #ee866f;
  --color-coral-light: #fae2d9;
  --color-gold: #d8ad55;
  --color-gold-light: #f4e8c7;
  --color-blue-light: #dfeaf0;
  --color-purple-light: #e8e2ed;

  --color-bg: #f5f3ed;
  --color-bg-card: #fffef9;
  --color-bg-subtle: #ece9e1;
  --color-text: #17342c;
  --color-text-secondary: #6f7d76;
  --color-text-light: #9ba8a1;
  --color-border: #dedfd7;
  --color-border-light: #eaebe3;
  --color-danger: #ee866f;
  --color-success: #1f5b4a;
  --color-warning: #d8ad55;

  /* Spacing */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;

  /* Radius */
  --radius-sm: 8px;
  --radius-md: 18px;
  --radius-lg: 20px;
  --radius-xl: 24px;
  --radius-card: 28px 28px 28px 8px;
  --radius-full: 999px;

  /* Typography */
  --font-size-xs: 13px;
  --font-size-sm: 14px;
  --font-size-base: 16px;
  --font-size-md: 18px;
  --font-size-lg: 20px;
  --font-size-xl: 24px;
  --font-size-2xl: 28px;
  --font-size-3xl: 36px;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* Shadows */
  --shadow-sm: 0 1px 3px rgba(34,64,53,0.04);
  --shadow-md: 0 4px 12px rgba(34,64,53,0.06);
  --shadow-lg: 0 14px 38px rgba(34,64,53,0.09);

  /* Layout */
  --nav-height: 60px;
  --max-width: 480px;

  /* Transitions */
  --transition: 0.2s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { font-size: 16px; -webkit-text-size-adjust: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: var(--font-size-base);
  line-height: 1.6;
  color: var(--color-text);
  background: var(--color-bg);
  -webkit-font-smoothing: antialiased;
  -webkit-overflow-scrolling: touch;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  padding-bottom: var(--nav-height);
}

#app { min-height: 100vh; }

/* ===== Layout ===== */
.container {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: var(--space-md);
}

.container-wide {
  max-width: 800px;
  margin: 0 auto;
  padding: var(--space-md);
}

.page {
  min-height: calc(100vh - var(--nav-height));
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Bottom Navigation ===== */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: var(--nav-height);
  background: var(--color-bg-card);
  border-top: 1px solid var(--color-border-light);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  background: none;
  border: none;
  cursor: pointer;
  padding: var(--space-sm) var(--space-md);
  min-height: 44px;
  min-width: 44px;
  color: var(--color-text-light);
  font-size: var(--font-size-xs);
  font-weight: var(--font-weight-medium);
  transition: color var(--transition);
}

.nav-item.active { color: var(--color-primary); }
.nav-item:active { transform: scale(0.95); }

.nav-icon {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
}

/* ===== Cards ===== */
.card {
  background: var(--color-bg-card);
  border-radius: var(--radius-lg);
  padding: var(--space-lg);
  box-shadow: var(--shadow-sm);
  margin-bottom: var(--space-md);
}

.card-clickable {
  cursor: pointer;
  transition: box-shadow var(--transition), transform var(--transition);
}
.card-clickable:active { transform: scale(0.98); box-shadow: var(--shadow-md); }

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--space-md);
}

/* ===== Typography ===== */
h1 { font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold); }
h2 { font-size: var(--font-size-xl); font-weight: var(--font-weight-bold); }
h3 { font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); }
h4 { font-size: var(--font-size-md); font-weight: var(--font-weight-semibold); }

.text-secondary { color: var(--color-text-secondary); }
.text-light { color: var(--color-text-light); }
.text-primary { color: var(--color-primary); }
.text-mint { color: var(--color-mint); }
.text-coral { color: var(--color-coral); }
.text-gold { color: var(--color-gold); }
.text-danger { color: var(--color-danger); }
.text-center { text-align: center; }

.text-xs { font-size: var(--font-size-xs); }
.text-sm { font-size: var(--font-size-sm); }
.text-lg { font-size: var(--font-size-lg); }

/* ===== Badges ===== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px;
  border-radius: var(--radius-full);
  font-size: var(--font-size-xs);
  font-weight: var(--font-weight-medium);
}

.badge-primary { background: var(--color-bg-subtle); color: var(--color-primary); }
.badge-mint { background: rgba(77,208,168,0.15); color: #2a9d6e; }
.badge-coral { background: rgba(255,122,107,0.15); color: #c94d3e; }
.badge-gold { background: rgba(245,185,66,0.15); color: #b8860b; }
.badge-gray { background: #f0f2f1; color: var(--color-text-secondary); }
.badge-new { background: rgba(77,208,168,0.2); color: #1a8a5e; }
.badge-learning { background: rgba(45,138,104,0.15); color: var(--color-primary-light); }
.badge-reviewing { background: rgba(245,185,66,0.15); color: #b8860b; }
.badge-mastered { background: rgba(39,174,96,0.15); color: #1e8449; }

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  padding: 12px var(--space-lg);
  min-height: 44px;
  border-radius: var(--radius-md);
  border: none;
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-semibold);
  cursor: pointer;
  transition: all var(--transition);
  text-decoration: none;
}

.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary {
  background: var(--color-primary);
  color: white;
}
.btn-primary:active { background: var(--color-primary-dark); }

.btn-mint {
  background: var(--color-mint);
  color: white;
}

.btn-coral {
  background: var(--color-coral);
  color: white;
}

.btn-gold {
  background: var(--color-gold);
  color: white;
}

.btn-outline {
  background: transparent;
  border: 2px solid var(--color-border);
  color: var(--color-text-secondary);
}

.btn-outline-primary {
  background: transparent;
  border: 2px solid var(--color-primary);
  color: var(--color-primary);
}

.btn-ghost {
  background: var(--color-bg-subtle);
  color: var(--color-text-secondary);
}

.btn-danger {
  background: var(--color-danger);
  color: white;
}

.btn-block { width: 100%; }
.btn-sm { padding: 8px 16px; min-height: 36px; font-size: var(--font-size-sm); }
.btn-lg { padding: 16px 32px; min-height: 52px; font-size: var(--font-size-md); }

/* ===== Progress ===== */
.progress-bar {
  width: 100%;
  height: 8px;
  background: var(--color-border-light);
  border-radius: var(--radius-full);
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--color-primary);
  border-radius: var(--radius-full);
  transition: width 0.4s ease;
}
.progress-bar-fill.mint { background: var(--color-mint); }
.progress-bar-fill.coral { background: var(--color-coral); }
.progress-bar-fill.gold { background: var(--color-gold); }

.progress-ring {
  width: 60px; height: 60px;
  position: relative;
}
.progress-ring svg { transform: rotate(-90deg); }
.progress-ring-bg { stroke: var(--color-border-light); }
.progress-ring-fill { stroke: var(--color-primary); transition: stroke-dashoffset 0.4s ease; }

/* ===== Inputs ===== */
input[type="text"], input[type="password"], input[type="number"], input[type="search"],
input[type="email"], textarea, select {
  width: 100%;
  padding: 12px var(--space-md);
  min-height: 44px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font-size: var(--font-size-base);
  font-family: inherit;
  background: var(--color-bg-card);
  color: var(--color-text);
  outline: none;
  transition: border-color var(--transition);
}

input:focus, textarea:focus, select:focus {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(26,107,78,0.1);
}

textarea { min-height: 80px; resize: vertical; line-height: 1.6; }

input[type="range"] {
  -webkit-appearance: none;
  width: 100%;
  height: 6px;
  background: var(--color-border-light);
  border-radius: var(--radius-full);
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--color-primary);
  cursor: pointer;
}

input[type="checkbox"] { width: 20px; height: 20px; min-height: auto; }

/* ===== Lists ===== */
.list-item {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: var(--space-md);
  background: var(--color-bg-card);
  border-radius: var(--radius-md);
  margin-bottom: var(--space-sm);
  cursor: pointer;
  transition: transform var(--transition);
}
.list-item:active { transform: scale(0.98); }

.list-item-icon {
  width: 40px; height: 40px;
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 20px;
}

.list-item-content { flex: 1; min-width: 0; }
.list-item-title { font-weight: var(--font-weight-semibold); font-size: var(--font-size-base); }
.list-item-subtitle { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
.list-item-action { color: var(--color-text-light); flex-shrink: 0; }

/* ===== Tags / Chips ===== */
.chip {
  display: inline-flex;
  align-items: center;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  background: var(--color-bg-subtle);
  color: var(--color-text-secondary);
  font-size: var(--font-size-xs);
  font-weight: var(--font-weight-medium);
  cursor: pointer;
  transition: all var(--transition);
}
.chip.active {
  background: var(--color-primary);
  color: white;
}
.chip:active { transform: scale(0.95); }

/* ===== Rating Buttons ===== */
.rating-group {
  display: flex;
  gap: var(--space-sm);
  justify-content: center;
}
.rating-btn {
  flex: 1;
  padding: 10px;
  min-height: 44px;
  border-radius: var(--radius-md);
  border: 2px solid var(--color-border);
  background: var(--color-bg-card);
  color: var(--color-text-secondary);
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-sm);
  cursor: pointer;
  transition: all var(--transition);
}
.rating-btn:active { transform: scale(0.95); }
.rating-btn.again { border-color: var(--color-danger); color: var(--color-danger); }
.rating-btn.hard { border-color: var(--color-coral); color: var(--color-coral); }
.rating-btn.good { border-color: var(--color-mint); color: #2a9d6e; }
.rating-btn.easy { border-color: var(--color-primary); color: var(--color-primary); }

/* ===== Session Flow ===== */
.session-bar {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: var(--space-md);
  background: var(--color-bg-card);
  border-bottom: 1px solid var(--color-border-light);
  position: sticky;
  top: 0;
  z-index: 50;
}
.session-steps {
  display: flex;
  gap: 6px;
  flex: 1;
}
.session-step-dot {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--color-border-light);
}
.session-step-dot.active { background: var(--color-primary); }
.session-step-dot.done { background: var(--color-mint); }

/* ===== Toast ===== */
.toast-container {
  position: fixed;
  top: var(--space-lg);
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  pointer-events: none;
}
.toast {
  background: var(--color-text);
  color: white;
  padding: 12px 20px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  font-size: var(--font-size-sm);
  margin-bottom: var(--space-sm);
  animation: slideDown 0.3s ease;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn 0.15s ease;
}
.modal {
  background: var(--color-bg-card);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  width: 100%;
  max-width: var(--max-width);
  max-height: 80vh;
  overflow-y: auto;
  padding: var(--space-lg);
  padding-bottom: calc(var(--space-xl) + env(safe-area-inset-bottom, 0));
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-handle {
  width: 40px; height: 4px;
  background: var(--color-border);
  border-radius: 2px;
  margin: 0 auto var(--space-lg);
}

/* ===== Empty State ===== */
.empty-state {
  text-align: center;
  padding: var(--space-2xl) var(--space-md);
  color: var(--color-text-light);
}
.empty-state-icon {
  font-size: 48px;
  margin-bottom: var(--space-md);
}

/* ===== Loading ===== */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-xl);
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--color-border-light);
  border-top-color: var(--color-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Utility ===== */
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.justify-center { justify-content: center; }
.flex-1 { flex: 1; }
.gap-sm { gap: var(--space-sm); }
.gap-md { gap: var(--space-md); }
.gap-lg { gap: var(--space-lg); }
.mt-sm { margin-top: var(--space-sm); }
.mt-md { margin-top: var(--space-md); }
.mt-lg { margin-top: var(--space-lg); }
.mb-sm { margin-bottom: var(--space-sm); }
.mb-md { margin-bottom: var(--space-md); }
.mb-lg { margin-bottom: var(--space-lg); }
.p-md { padding: var(--space-md); }
.p-lg { padding: var(--space-lg); }
.hidden { display: none !important; }
.w-full { width: 100%; }
.text-left { text-align: left; }
.text-right { text-align: right; }
.break-words { word-break: break-word; }
.whitespace-pre { white-space: pre-wrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== Hide Bottom Nav (for conversation/immersive modes) ===== */
.bottom-nav.hidden { display: none !important; }
body.no-nav { padding-bottom: 0; }

/* ===== Conversation Input Bar ===== */
.conv-input-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--color-bg-card);
  padding: 12px 16px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0));
  border-top: 1px solid var(--color-border-light);
  z-index: 300;
  max-width: var(--max-width);
  margin: 0 auto;
  box-shadow: 0 -2px 12px rgba(34,64,53,0.08);
}
/* When bottom-nav is hidden, conv-input-bar sits at the very bottom */
body.no-nav .conv-input-bar { z-index: 300; }
/* Ensure conv page content has enough bottom space for input bar */
.conv-page-content { padding-bottom: 90px !important; }

/* ===== Desktop Adaptation ===== */
@media (min-width: 768px) {
  body { background: #e8f0ed; }
  .container, .container-wide {
    max-width: var(--max-width);
    box-shadow: 0 0 40px rgba(0,0,0,0.05);
    min-height: 100vh;
    background: var(--color-bg);
  }
  .bottom-nav {
    max-width: var(--max-width);
    left: 50%;
    transform: translateX(-50%);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
  }
}

/* ===== V2: Listening Page Styles ===== */
.keyword-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.keyword-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: var(--color-bg-subtle);
  border-radius: var(--radius-sm);
  border: 1px solid var(--color-border-light);
}
.keyword-english {
  font-size: 16px;
  font-weight: 600;
  color: var(--color-primary);
}
.listening-player {
  text-align: center;
}
.listening-highlight {
  background: rgba(245, 185, 66, 0.25);
  border-radius: 3px;
  padding: 0 3px;
  font-weight: 600;
}
.comprehension-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.comprehension-option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--color-bg-card);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
  font-size: 15px;
  color: var(--color-text);
}
.comprehension-option:hover {
  border-color: var(--color-primary-light);
  background: var(--color-bg-subtle);
}
.comprehension-option.selected {
  border-color: var(--color-primary);
  background: rgba(26, 107, 78, 0.06);
}
.comprehension-option.correct {
  border-color: var(--color-mint);
  background: rgba(77, 208, 168, 0.12);
}
.comprehension-option.incorrect {
  border-color: var(--color-coral);
  background: rgba(255, 122, 107, 0.12);
}
.comprehension-option:disabled {
  cursor: default;
  opacity: 0.85;
}
.comprehension-option.answered {
  cursor: default;
  opacity: 0.85;
}
.comprehension-option.answered:hover {
  border-color: var(--color-border);
  background: var(--color-bg-card);
}
.comprehension-option.answered.correct:hover {
  border-color: var(--color-mint);
  background: rgba(77, 208, 168, 0.12);
}
.comprehension-option.answered.incorrect:hover {
  border-color: var(--color-coral);
  background: rgba(255, 122, 107, 0.12);
}
.option-letter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--color-bg-subtle);
  font-weight: 700;
  font-size: 13px;
  color: var(--color-primary);
  flex-shrink: 0;
}
.comprehension-option.correct .option-letter {
  background: var(--color-mint);
  color: white;
}
.comprehension-option.incorrect .option-letter {
  background: var(--color-coral);
  color: white;
}
.btn-active {
  background: var(--color-primary) !important;
  color: white !important;
  border-color: var(--color-primary) !important;
}
.text-mint { color: var(--color-mint); }

/* ===== V2: Assessment Page ===== */
.assessment-intro {
  line-height: 1.8;
}

/* ===== V2: Listening Text (reveal phase) ===== */
.listening-text {
  word-wrap: break-word;
  overflow-wrap: break-word;
}

/* ===== V2: Heading Typography ===== */
h1, h2, h3 {
  font-family: Georgia, "Times New Roman", "Songti SC", serif;
  letter-spacing: -0.01em;
}

/* ===== V2: Card with asymmetric radius ===== */
.card-hero {
  border-radius: 28px 28px 28px 8px;
  padding: 20px 22px;
}

/* ===== V2: Vocabulary Learning ===== */
.vocab-precheck-item {

.vocab-precheck-btn {

  <script>
    // ===== 启动保险：超时/失败兜底 =====
    // 任何 initApp 卡死/失败的情况下，必须结束 loading 并展示可重试界面
    window.__WEC_BOOT__ = {
      finished: false,
      failed: null,
      timedOut: false
    };

    function wecShowBootError(title, detail, canRetry) {
      var app = document.getElementById('app');
      if (!app) return;
      var safeTitle = String(title || '应用初始化失败').replace(/[<>&]/g, function (c) {
        return { '<': '<', '>': '>', '&': '&' }[c];
      });
      var safeDetail = String(detail || '').replace(/[<>&]/g, function (c) {
        return { '<': '<', '>': '>', '&': '&' }[c];
      });
      app.innerHTML = '' +
        '<div style="padding: 32px 20px; max-width: 480px; margin: 0 auto; text-align: center;">' +
          '<div style="font-size: 48px; margin-bottom: 12px;">⚠️</div>' +
          '<h2 style="color: #1a2e28; margin-bottom: 12px;">' + safeTitle + '</h2>' +
          '<p style="color: #5a6e68; font-size: 14px; line-height: 1.6; margin-bottom: 24px;">' + safeDetail + '</p>' +
          (canRetry
            ? '<button id="wec-retry-btn" style="background: #1a6b4e; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;">🔄 重试</button>'
            : '') +
        '</div>';
      var btn = document.getElementById('wec-retry-btn');
      if (btn) btn.addEventListener('click', function () { location.reload(); });
    }

    function wecShowOfflineFallback(reason) {
      // 即使 DB 完全失败，也可以进入一个纯只读静态演示模式
      var app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = '' +
        '<div style="padding: 24px 16px; max-width: 480px; margin: 0 auto;">' +
          '<div class="card" style="background: #fff3cd; border-left: 4px solid #f5b942;">' +
            '<strong>本地存储不可用</strong>' +
            '<p style="font-size: 14px; color: #5a6e68; margin-top: 6px;">' + String(reason || '浏览器存储被禁用或异常') + '。已切换到只读模式，刷新页面或清理浏览器数据后重试。</p>' +
          '</div>' +
          '<div class="card" style="margin-top: 12px;">' +
            '<h3 style="margin-bottom: 8px;">📅 Day 1 学习内容预览</h3>' +
            '<p style="color: #5a6e68; font-size: 14px;">主题：汇报当前状态</p>' +
            '<p style="color: #5a6e68; font-size: 14px;">时长：25 分钟</p>' +
            '<p style="color: #5a6e68; font-size: 14px;">复习数：5 个</p>' +
          '</div>' +
        '</div>';
    }

    // 8 秒硬超时：initApp 未结束则切换到降级模式
    // 不再只显示错误页，而是触发降级模式让 initApp 继续渲染
    setTimeout(function () {
      if (!window.__WEC_BOOT__.finished) {
        window.__WEC_BOOT__.timedOut = true;
        // 通知 openDB 的超时已触发，强制切到降级模式
        window.dispatchEvent(new CustomEvent('wec-boot-timeout'));
        // 如果 2 秒后仍未完成（降级也失败了），才显示错误页
        setTimeout(function () {
          if (!window.__WEC_BOOT__.finished) {
            wecShowBootError(
              '启动时间过长',
              '应用初始化超过 8 秒未完成。可能是浏览器 IndexedDB 被禁用、其它标签页占用、或本地存储异常。',
              true
            );
          }
        }, 2000);
      }
    }, 8000);

    // 监听全局未捕获错误，避免静默卡死
    window.addEventListener('error', function (e) {
      if (!window.__WEC_BOOT__.finished) {
        window.__WEC_BOOT__.failed = e.message || '未知错误';
      }
    });
    window.addEventListener('unhandledrejection', function (e) {
      if (!window.__WEC_BOOT__.finished) {
        var msg = (e.reason && (e.reason.message || e.reason.toString())) || 'Promise rejection';
        window.__WEC_BOOT__.failed = msg;
      }
    });
  </script>

  <script>

// ===== js/db.js =====
// ===== IndexedDB Storage Engine =====
// 持久化存储：课程内容、学习记录、复习计划、错题库、导入语料
// 包含内存降级模式：IndexedDB 不可用时自动切换到内存 Map，保证应用可用

const DB_NAME = 'WorkEnglishCoachDB';
const DB_VERSION = 2;

const STORES = {
  knowledgeItems: 'knowledgeItems',       // 知识库条目
  learningAttempts: 'learningAttempts',   // 学习尝试记录
  masteryRecords: 'masteryRecords',       // 四级掌握记录
  reviewSchedule: 'reviewSchedule',       // 复习排程
  errorBank: 'errorBank',                 // 错题库
  dailySessions: 'dailySessions',         // 每日学习记录
  imports: 'imports',                     // 导入的对话
  quizAttempts: 'quizAttempts',           // 测验记录
  conversationSessions: 'conversationSessions', // 对话练习记录
  skillScores: 'skillScores',            // 能力评分
  assessments: 'assessments'              // V2: 入门/阶段测评记录
};

let dbInstance = null;

// ===== 降级模式状态 =====
let _fallbackMode = false;       // 是否处于内存降级模式
let _fallbackReason = '';        // 降级原因（用于诊断）
let _fallbackStores = {};        // 内存中的 store: { storeName: Map(key -> value) }
let _fallbackAutoInc = {};       // 自增计数器

function _initFallbackStores() {
  for (const store of Object.values(STORES)) {
    if (!_fallbackStores[store]) {
      _fallbackStores[store] = new Map();
      _fallbackAutoInc[store] = 1;
    }
  }
}

function isFallbackMode() {
  return _fallbackMode;
}

function getFallbackReason() {
  return _fallbackReason;
}

function enableFallbackMode(reason) {
  if (_fallbackMode) return;
  _fallbackMode = true;
  _fallbackReason = reason || 'unknown';
  _initFallbackStores();
  console.warn('[WEC] IndexedDB 不可用，已切换到内存降级模式。原因：' + _fallbackReason);
}

// ===== openDB：带 onblocked、onerror 和超时处理 =====
function openDB() {
  return new Promise((resolve, reject) => {
    if (_fallbackMode) {
      reject(new Error('fallback mode: ' + _fallbackReason));
      return;
    }
    if (dbInstance) { resolve(dbInstance); return; }

    // 检查 indexedDB 是否存在
    if (typeof indexedDB === 'undefined' || !indexedDB) {
      enableFallbackMode('browser_no_indexeddb');
      reject(new Error('IndexedDB 不可用：浏览器不支持'));
      return;
    }

    let settled = false;
    const timeoutId = setTimeout(() => {
      if (!settled) {
        settled = true;
        enableFallbackMode('open_timeout_5s');
        reject(new Error('IndexedDB 打开超时（5秒无响应）'));
      }
    }, 5000);

    // 监听 boot 超时事件，强制切换降级模式
    var bootTimeoutHandler = function () {
      if (!settled) {
        settled = true;
        clearTimeout(timeoutId);
        enableFallbackMode('boot_timeout_8s');
        reject(new Error('IndexedDB 打开超时（启动8秒超时）'));
      }
    };
    window.addEventListener('wec-boot-timeout', bootTimeoutHandler, { once: true });

    try {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onerror = () => {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        var reason = 'db_error';
        try {
          if (req.error && req.error.name === 'QuotaExceededError') reason = 'quota_exceeded';
          else if (req.error && req.error.name === 'SecurityError') reason = 'security_error';
          else if (req.error && req.error.message) reason = req.error.message;
        } catch(e) {}
        enableFallbackMode(reason);
        reject(req.error || new Error('IndexedDB 打开失败：' + reason));
      };
      req.onblocked = () => {
        // 数据库被其他标签页占用，等待但不无限等
        if (!settled) {
          settled = true;
          clearTimeout(timeoutId);
          enableFallbackMode('db_blocked_by_other_tab');
          reject(new Error('IndexedDB 被其他标签页阻塞，已切换到内存模式'));
        }
      };
      req.onsuccess = () => {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        dbInstance = req.result;
        resolve(dbInstance);
      };
      req.onupgradeneeded = (e) => {
      const db = e.target.result;
      // 知识库
      if (!db.objectStoreNames.contains(STORES.knowledgeItems)) {
        const s = db.createObjectStore(STORES.knowledgeItems, { keyPath: 'id' });
        s.createIndex('scenario', 'scenario_id', { unique: false });
        s.createIndex('type', 'type', { unique: false });
        s.createIndex('status', 'status', { unique: false });
        s.createIndex('source', 'source_conversation_id', { unique: false });
      }
      // 学习尝试
      if (!db.objectStoreNames.contains(STORES.learningAttempts)) {
        const s = db.createObjectStore(STORES.learningAttempts, { keyPath: 'id', autoIncrement: true });
        s.createIndex('itemId', 'item_id', { unique: false });
        s.createIndex('date', 'date', { unique: false });
      }
      // 掌握记录
      if (!db.objectStoreNames.contains(STORES.masteryRecords)) {
        db.createObjectStore(STORES.masteryRecords, { keyPath: 'item_id' });
      }
      // 复习排程
      if (!db.objectStoreNames.contains(STORES.reviewSchedule)) {
        const s = db.createObjectStore(STORES.reviewSchedule, { keyPath: 'item_id' });
        s.createIndex('dueDate', 'next_review_at', { unique: false });
      }
      // 错题库
      if (!db.objectStoreNames.contains(STORES.errorBank)) {
        const s = db.createObjectStore(STORES.errorBank, { keyPath: 'id', autoIncrement: true });
        s.createIndex('itemId', 'learning_item_id', { unique: false });
        s.createIndex('resolved', 'resolved', { unique: false });
      }
      // 每日学习
      if (!db.objectStoreNames.contains(STORES.dailySessions)) {
        const s = db.createObjectStore(STORES.dailySessions, { keyPath: 'day' });
        s.createIndex('date', 'date', { unique: false });
      }
      // 导入记录
      if (!db.objectStoreNames.contains(STORES.imports)) {
        const s = db.createObjectStore(STORES.imports, { keyPath: 'id', autoIncrement: true });
        s.createIndex('date', 'import_date', { unique: false });
      }
      // 测验记录
      if (!db.objectStoreNames.contains(STORES.quizAttempts)) {
        db.createObjectStore(STORES.quizAttempts, { keyPath: 'id', autoIncrement: true });
      }
      // 对话记录
      if (!db.objectStoreNames.contains(STORES.conversationSessions)) {
        db.createObjectStore(STORES.conversationSessions, { keyPath: 'id', autoIncrement: true });
      }
      // 能力评分
      if (!db.objectStoreNames.contains(STORES.skillScores)) {
        db.createObjectStore(STORES.skillScores, { keyPath: 'skill_key' });
      }
      // V2: 测评记录（Day 0 入门测评、第12周测评等）
      if (!db.objectStoreNames.contains(STORES.assessments)) {
        const s = db.createObjectStore(STORES.assessments, { keyPath: 'id', autoIncrement: true });
        s.createIndex('type', 'assessment_type', { unique: false });
        s.createIndex('date', 'date', { unique: false });
      }
    };
    } catch (openErr) {
      if (!settled) {
        settled = true;
        clearTimeout(timeoutId);
        enableFallbackMode('open_exception:' + ((openErr && openErr.message) || 'unknown'));
        reject(new Error('IndexedDB 打开异常：' + (openErr && openErr.message)));
      }
    }
  });
}

// ===== 降级模式下的内存操作 =====
function _fallbackPut(store, value) {
  _initFallbackStores();
  var map = _fallbackStores[store] || (_fallbackStores[store] = new Map());
  // 如果 store 有 keyPath，用 keyPath 的值作为 key；否则自增
  var key;
  if (value && value.id) key = value.id;
  else if (value && value.item_id) key = value.item_id;
  else if (value && value.skill_key) key = value.skill_key;
  else if (value && value.day) key = value.day;
  else { key = _fallbackAutoInc[store]++; }
  map.set(key, value);
  return Promise.resolve(value);
}

function _fallbackGet(store, key) {
  _initFallbackStores();
  var map = _fallbackStores[store] || (_fallbackStores[store] = new Map());
  return Promise.resolve(map.get(key) || null);
}

function _fallbackGetAll(store) {
  _initFallbackStores();
  var map = _fallbackStores[store] || (_fallbackStores[store] = new Map());
  return Promise.resolve(Array.from(map.values()));
}

function _fallbackDelete(store, key) {
  _initFallbackStores();
  var map = _fallbackStores[store] || (_fallbackStores[store] = new Map());
  map.delete(key);
  return Promise.resolve();
}

function _fallbackClear(store) {
  _initFallbackStores();
  _fallbackStores[store] = new Map();
  _fallbackAutoInc[store] = 1;
  return Promise.resolve();
}

function _fallbackCount(store) {
  _initFallbackStores();
  var map = _fallbackStores[store] || (_fallbackStores[store] = new Map());
  return Promise.resolve(map.size);
}

function _fallbackGetByIndex(store, indexName, value) {
  // 简化：遍历所有值匹配字段
  _initFallbackStores();
  var map = _fallbackStores[store] || (_fallbackStores[store] = new Map());
  var results = [];
  map.forEach(function(v) {
    if (v && v[indexName] === value) results.push(v);
  });
  return Promise.resolve(results);
}

// ===== 带降级的数据库操作 =====
async function dbPut(store, value) {
  if (_fallbackMode) return _fallbackPut(store, value);
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).put(value);
      tx.oncomplete = () => resolve(value);
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) {
    enableFallbackMode('put_fail:' + (e && e.message || 'unknown'));
    return _fallbackPut(store, value);
  }
}

async function dbGet(store, key) {
  if (_fallbackMode) return _fallbackGet(store, key);
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    enableFallbackMode('get_fail:' + (e && e.message || 'unknown'));
    return _fallbackGet(store, key);
  }
}

async function dbGetAll(store) {
  if (_fallbackMode) return _fallbackGetAll(store);
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    enableFallbackMode('getAll_fail:' + (e && e.message || 'unknown'));
    return _fallbackGetAll(store);
  }
}

async function dbDelete(store, key) {
  if (_fallbackMode) return _fallbackDelete(store, key);
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) {
    enableFallbackMode('delete_fail:' + (e && e.message || 'unknown'));
    return _fallbackDelete(store, key);
  }
}

async function dbClear(store) {
  if (_fallbackMode) return _fallbackClear(store);
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) {
    enableFallbackMode('clear_fail:' + (e && e.message || 'unknown'));
    return _fallbackClear(store);
  }
}

async function dbGetByIndex(store, indexName, value) {
  if (_fallbackMode) return _fallbackGetByIndex(store, indexName, value);
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readonly');
      const idx = tx.objectStore(store).index(indexName);
      const req = idx.getAll(value);
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    enableFallbackMode('getByIndex_fail:' + (e && e.message || 'unknown'));
    return _fallbackGetByIndex(store, indexName, value);
  }
}

async function dbCount(store) {
  if (_fallbackMode) return _fallbackCount(store);
  try {

// ===== Export / Import All Data =====
async function exportAllData() {
  const data = {};
  for (const [key, store] of Object.entries(STORES)) {
    try {
      data[key] = await dbGetAll(store);
    } catch (e) {
      data[key] = [];
    }
  }
  data._meta = { exportDate: new Date().toISOString(), version: DB_VERSION, app: 'WorkEnglishCoach' };
  return data;
}

async function importAllData(jsonData, replaceMode = true) {
  // 降级模式下也可导入到内存
  if (!jsonData || typeof jsonData !== 'object') throw new Error('数据格式无效');
  if (!jsonData._meta || jsonData._meta.app !== 'WorkEnglishCoach') {
    throw new Error('这不是 Work English Coach 的备份文件');
  }

  // 先备份当前数据
  const backup = await exportAllData();

  try {
    for (const [key, store] of Object.entries(STORES)) {
      if (replaceMode) await dbClear(store);
      if (jsonData[key] && Array.isArray(jsonData[key])) {
        for (const item of jsonData[key]) {
          await dbPut(store, item);
        }
      }
    }
    return { success: true, backup };
  } catch (e) {
    // 恢复备份
    for (const [key, store] of Object.entries(STORES)) {
      try {
        await dbClear(store);
        if (backup[key] && Array.isArray(backup[key])) {
          for (const item of backup[key]) {
            await dbPut(store, item);
          }
        }
      } catch (re) {}
    }
    throw new Error('导入失败，已恢复原数据: ' + e.message);
  }
}

async function resetAllData() {
  for (const store of Object.values(STORES)) {
    try { await dbClear(store); } catch (e) {}
  }
}

// ===== Date Helpers =====
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function daysBetween(date1, date2) {
  const d1 = new Date(date1); d1.setHours(0,0,0,0);
  const d2 = new Date(date2); d2.setHours(0,0,0,0);
  return Math.round((d2 - d1) / 86400000);
}

function getStudyDay(settings) {
  if (!settings.studyStartDate) return 1;
  const start = new Date(settings.studyStartDate);
  start.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const day = daysBetween(start, today) + 1;
  return Math.max(1, Math.min(day, 168));
}

function getWeek(studyDay) {
  return Math.ceil(studyDay / 7);
}

function getWeekPhase(week) {
  if (week <= 4) return { name: 'English Reactivation', range: 'Week 1-4' };
  if (week <= 8) return { name: 'Core Work Scenarios', range: 'Week 5-8' };
  if (week <= 12) return { name: 'Active Production', range: 'Week 9-12' };
  if (week <= 16) return { name: 'Meeting Communication', range: 'Week 13-16' };
  if (week <= 20) return { name: 'Problem Solving', range: 'Week 17-20' };
  return { name: 'Work Simulation', range: 'Week 21-24' };
}

// ===== Streak Tracking =====
function updateStreak(settings) {
  const today = todayStr();
  if (settings.lastStudyDate === today) return settings;

  if (settings.lastStudyDate) {
    const gap = daysBetween(settings.lastStudyDate, today);
    if (gap === 1) {
      settings.streakDays = (settings.streakDays || 0) + 1;
    } else if (gap > 1) {
      settings.streakDays = 1;
    }
  } else {
    settings.streakDays = 1;
  }
  settings.lastStudyDate = today;
  saveSettings(settings);
  return settings;
}

// ===== js/algorithm.js =====
// ===== Spaced Review Algorithm =====
// 独立、可测试的复习排程模块
// V4 重构：
//  - 接触次数追踪（exposure_count）："背过"不等于"学会"，一个词需要在不同语境接触多次
//  - 动态调度：以答题对错 + 反应速度为输入，千人千面，取代固定阶梯日历
//  - 掌握判定：接触 >= 8 次 且 近5次回忆成功率 >= 80% 且 首次接触 >= 3 天

// 四级掌握模型状态
const MASTERY_STATES = ['New', 'Learning', 'Reviewing', 'Mastered'];

// 四个维度
const MASTERY_DIMENSIONS = ['recognition', 'recall', 'usage', 'transfer'];

// 用户反馈等级
const RATINGS = {
  again: { multiplier: 0, label: '忘记', interval: 0 },
  hard: { multiplier: 0.5, label: '困难', interval: 1 },
  good: { multiplier: 1, label: '掌握', interval: 3 },
  easy: { multiplier: 1.5, label: '轻松', interval: 7 }
};

// 答对且反应时间 <= 该阈值（毫秒）视为"快速正确"，间隔按 ease 放大
const FAST_RESPONSE_MS = 4000;
// ease 因子边界
const EASE_DEFAULT = 2.5;
const EASE_MIN = 1.3;

// ===== 旧记录字段兜底（V3 → V4 迁移，纯内存补齐，不落库 schema 变更） =====
function _ensureV4Fields(record) {
  if (typeof record.exposure_count !== 'number' || isNaN(record.exposure_count)) {
    record.exposure_count = 0;
  }
  if (!record.exposure_first_at) record.exposure_first_at = null;
  if (!Array.isArray(record.recall_history)) record.recall_history = [];
  if (typeof record.ease !== 'number' || isNaN(record.ease) || record.ease <= 0) {
    record.ease = EASE_DEFAULT;
  }
  return record;
}

// ===== 初始化掌握记录 =====
function initMastery(itemId) {
  const record = {
    item_id: itemId,
    recognition_score: 0,
    recall_score: 0,
    usage_score: 0,
    transfer_score: 0,
    recognition_evidence_count: 0,
    recall_evidence_count: 0,
    usage_evidence_count: 0,
    transfer_evidence_count: 0,
    recognition_correct: 0,
    recognition_incorrect: 0,
    recall_correct: 0,
    recall_incorrect: 0,
    usage_correct: 0,
    usage_incorrect: 0,
    transfer_correct: 0,
    transfer_incorrect: 0,
    last_attempt_at: null,
    average_response_time: 0,
    hint_usage_count: 0,
    correct_count: 0,
    incorrect_count: 0,
    mastery_state: 'New',
    review_count: 0,
    interval_days: 0,
    next_review_at: Date.now(),
    // V4 新增：接触追踪 + 回忆历史 + 难度因子
    exposure_count: 0,
    exposure_first_at: null,
    recall_history: [],   // [{ success: bool, ts: number }]，保留最近 30 条
    ease: EASE_DEFAULT,
    created_at: new Date().toISOString(),
    updated_at: new Date().toISOString()
  };
  return record;
}

// ===== 记录一次接触（纯函数，不落库；调用方负责 dbPut） =====
// 接触 = 学习卡片查看、测验作答、点词加入学习等任何一次真实遇见
function noteExposure(record) {
  _ensureV4Fields(record);
  record.exposure_count++;
  if (!record.exposure_first_at) record.exposure_first_at = Date.now();
  record.updated_at = new Date().toISOString();
  return record;
}

// ===== 更新掌握记录 =====
function updateMastery(record, rating, opts = {}) {
  const { dimension = 'recognition', responseTime = 0, hintUsed = false, answerMode = 'text' } = opts;
  _ensureV4Fields(record);

  record.review_count++;
  record.last_attempt_at = Date.now();
  record.updated_at = new Date().toISOString();

  // 一次测验作答同时计为一次接触
  record.exposure_count++;
  if (!record.exposure_first_at) record.exposure_first_at = Date.now();

  // 更新反应时间
  const totalTime = record.average_response_time * (record.review_count - 1) + responseTime;
  record.average_response_time = Math.round(totalTime / record.review_count);

  // 更新提示使用
  if (hintUsed) record.hint_usage_count++;

  // 更新维度分数
  const dimKey = dimension; // recognition / recall / usage / transfer
  const evidenceKey = `${dimKey}_evidence_count`;
  const correctKey = `${dimKey}_correct`;
  const incorrectKey = `${dimKey}_incorrect`;
  const scoreKey = `${dimKey}_score`;

  record[evidenceKey]++;

  const isCorrect = rating === 'good' || rating === 'easy';

  if (isCorrect) {
    record[correctKey]++;
    record.correct_count++;
  } else {
    record[incorrectKey]++;
    record.incorrect_count++;
  }

  // V4：回忆历史（驱动掌握判定的"近5次成功率"）
  record.recall_history.push({ success: isCorrect, ts: Date.now() });
  if (record.recall_history.length > 30) {
    record.recall_history = record.recall_history.slice(-30);
  }

  // V4：ease 难度因子动态调整
  const fastCorrect = isCorrect && !hintUsed && responseTime > 0 && responseTime <= FAST_RESPONSE_MS;
  if (!isCorrect) {
    record.ease = Math.max(EASE_MIN, record.ease - 0.3);
  } else if (fastCorrect) {
    record.ease = Math.min(3.2, record.ease + 0.08);
  }

  // 计算维度分数（0-100）
  const totalAttempts = record[correctKey] + record[incorrectKey];
  const accuracy = totalAttempts > 0 ? record[correctKey] / totalAttempts : 0;
  const hintPenalty = record.hint_usage_count > 0 ? Math.min(0.15, record.hint_usage_count * 0.03) : 0;
  const speedScore = responseTime > 0 ? Math.max(0, 1 - responseTime / 30000) : 0.5; // 30秒为基准
  const evidenceBonus = Math.min(1, record[evidenceKey] / 5); // 5次证据为满分

  // 不同维度的权重不同
  let dimWeight = 1;
  if (dimKey === 'recall') dimWeight = 1.1;
  if (dimKey === 'usage') dimWeight = 1.2;
  if (dimKey === 'transfer') dimWeight = 1.3;

  const rawScore = (accuracy * 50 + evidenceBonus * 25 + speedScore * 15 - hintPenalty * 15) * dimWeight;
  record[scoreKey] = Math.max(0, Math.min(100, Math.round(rawScore)));

  // 更新间隔（V4 动态调度：对错 + 反应速度）
  record.interval_days = computeInterval(record, rating, dimension, hintUsed, responseTime);
  record.next_review_at = Date.now() + record.interval_days * 86400000;

  // 更新整体掌握状态
  record.mastery_state = computeMasteryState(record);

  return record;
}

// ===== 计算掌握状态 =====
// V4 掌握判定（第一性原理：学会 = 多次接触 + 稳定主动回忆 + 时间沉淀）：
//   接触 >= 8 次 且 近 5 次回忆成功率 >= 80% 且 首次接触距今 >= 3 天
// 旧数据兼容：无 exposure/recall_history 时回退到 review_count / 总正确率
function computeMasteryState(record) {
  _ensureV4Fields(record);

  const exposure = record.exposure_count > 0 ? record.exposure_count : (record.review_count || 0);
  const firstAt = record.exposure_first_at ||
    (record.created_at ? Date.parse(record.created_at) : Date.now());
  const daysSinceFirst = (Date.now() - firstAt) / 86400000;

  // 近 5 次回忆成功率
  const hist = record.recall_history;
  let recallOk = false;
  if (hist.length >= 5) {
    const last5 = hist.slice(-5);
    recallOk = last5.filter(h => h.success).length / 5 >= 0.8;
  } else if (hist.length === 0) {
    // 旧数据回退：用累计正确率，且要求至少 5 次作答
    const tot = (record.correct_count || 0) + (record.incorrect_count || 0);
    recallOk = tot >= 5 && (record.correct_count || 0) / tot >= 0.8;
  }
  // hist 1~4 条：回忆证据不足，不允许判 Mastered

  if (exposure >= 8 && recallOk && daysSinceFirst >= 3) {
    return 'Mastered';
  }

  // Reviewing: 有足够的 recall 证据
  if (record.recall_score >= 50 && record.recall_evidence_count >= 2) {
    return 'Reviewing';
  }

  // Learning: 有开始学习
  const totalEvidence = (record.recognition_evidence_count || 0) +
                        (record.recall_evidence_count || 0) +
                        (record.usage_evidence_count || 0) +
                        (record.transfer_evidence_count || 0);
  if (totalEvidence >= 1 || exposure >= 1) {
    return 'Learning';
  }

  return 'New';
}

// ===== 计算复习间隔（V4 动态调度） =====
// 输入：对错 + 反应速度 + ease 因子；不再使用固定阶梯日历
//   答错        → 1 天（ease 已在 updateMastery 中 -0.3，下限 1.3）
//   答对且快    → base × ease
//   答对但慢/用提示 → base × 1.5
//   base = 上次间隔 > 0 ? 上次间隔 : 1
function computeInterval(record, rating, dimension, hintUsed, responseTime) {
  _ensureV4Fields(record);

  if (rating === 'again') return 1;

  const prev = (typeof record.interval_days === 'number' && record.interval_days > 0)
    ? record.interval_days : 0;
  const base = prev > 0 ? prev : 1;

  const isCorrect = rating === 'good' || rating === 'easy';
  const fastCorrect = isCorrect && !hintUsed &&
    responseTime > 0 && responseTime <= FAST_RESPONSE_MS;

  let interval;
  if (fastCorrect) {
    interval = Math.round(base * record.ease);
  } else {
    // 答对但慢、hard、或用提示：温和推进
    interval = Math.round(base * 1.5);
  }

  return Math.max(1, interval);
}

// ===== Learning Priority Score =====
function computePriority(item, mastery, opts = {}) {
  const {
    workRelevance = 3,
    frequency = 2,
    reusability = 3,
    communicationValue = 3,
    reviewUrgency = 0,
    errorIntensity = 0,
    currentTime = 25,
    userWeakSkills = []
  } = opts;

  // 权重
  const w = {
    workRelevance: 0.28,
    frequency: 0.14,
    reusability: 0.18,
    communicationValue: 0.18,
    reviewUrgency: 0.12,
    errorIntensity: 0.10
  };

  // 归一化到 0-5
  const wr = Math.min(5, workRelevance);
  const fr = Math.min(5, frequency);
  const ru = Math.min(5, reusability);
  const cv = Math.min(5, communicationValue);

  // 复习紧迫度
  const isDue = mastery && Date.now() >= mastery.next_review_at;
  const overdueDays = isDue && mastery.next_review_at ?
    Math.floor((Date.now() - mastery.next_review_at) / 86400000) : 0;
  const ru_score = Math.min(5, reviewUrgency + (isDue ? 2 : 0) + Math.min(2, overdueDays * 0.5));

  // 错误强度
  const ei_score = Math.min(5, errorIntensity);

  // 掌握度惩罚（已掌握的降低优先级）
  const masteryState = mastery ? mastery.mastery_state : 'New';
  const masteryPenalty = masteryState === 'Mastered' ? 0.3 : masteryState === 'Reviewing' ? 0.7 : 1;

  // 难度适配
  const difficultyFit = item.difficulty && item.difficulty <= 3 ? 1 : 0.8;

  let score = (wr * w.workRelevance + fr * w.frequency + ru * w.reusability +
               cv * w.communicationValue + ru_score * w.reviewUrgency +
               ei_score * w.errorIntensity) * masteryPenalty * difficultyFit;

  // 弱项加成
  if (item.skill_key && userWeakSkills.includes(item.skill_key)) {
    score *= 1.15;
  }

  return Math.round(score * 100) / 100;
}

// ===== 获取今日到期复习 =====
// 只返回已经学过(review_count > 0)且到期的项目
// 新项目(New)不进入复习队列，而是通过 Learn 阶段学习
async function getDueReviewItems() {
  const allSchedule = await dbGetAll(STORES.reviewSchedule);
  const allMastery = await dbGetAll(STORES.masteryRecords);
  const masteryMap = {};
  allMastery.forEach(m => masteryMap[m.item_id] = m);
  const now = Date.now();
  return allSchedule
    .filter(s => {
      const m = masteryMap[s.item_id];
      // 只复习已经学过的（review_count > 0 且非 New 状态）
      if (!m || m.mastery_state === 'New') return false;
      return s.next_review_at <= now;
    })
    .sort((a, b) => a.next_review_at - b.next_review_at);
}

// ===== 获取今日新内容 =====
async function getNewItemsForToday(settings, count) {
  const allItems = await dbGetAll(STORES.knowledgeItems);
  const allMastery = await dbGetAll(STORES.masteryRecords);
  const masteryMap = {};
  allMastery.forEach(m => masteryMap[m.item_id] = m);

  // 过滤：未学习或非Mastered
  const candidates = allItems.filter(item => {
    const m = masteryMap[item.id];
    return !m || m.mastery_state !== 'Mastered';
  });

  // 计算优先级排序
  const scored = candidates.map(item => {
    const m = masteryMap[item.id] || initMastery(item.id);
    const score = computePriority(item, m);
    return { item, mastery: m, score };
  });

  scored.sort((a, b) => b.score - a.score);

  return scored.slice(0, count);
}

  };


  function _esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function _readLS(key, fallback) {
    try {
      const v = JSON.parse(localStorage.getItem(key) || 'null');
      return v == null ? fallback : v;
    } catch (e) { return fallback; }
  }

  function _writeLS(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  // 词形还原尝试：原词 → 去 's → 去复数 s → 去 ed/ing
  function _lemmaCandidates(word) {
    const w = String(word || '').toLowerCase().replace(/[’']s$/, '');
    const cands = [w];
    if (w.endsWith("'s")) cands.push(w.slice(0, -2));
    if (w.endsWith('s') && w.length > 3) cands.push(w.slice(0, -1));
    if (w.endsWith('es') && w.length > 3) cands.push(w.slice(0, -2));
    if (w.endsWith('ed') && w.length > 4) { cands.push(w.slice(0, -2)); cands.push(w.slice(0, -1)); }
    if (w.endsWith('ing') && w.length > 5) { cands.push(w.slice(0, -3)); cands.push(w.slice(0, -3) + 'e'); }
    return [...new Set(cands)];
  }

  // --- 词库索引（惰性构建） ---
  let _vocabIndex = null;
  function _buildVocabIndex() {
    if (_vocabIndex) return _vocabIndex;
    _vocabIndex = new Map();
    if (typeof VOCAB_ITEMS !== 'undefined' && Array.isArray(VOCAB_ITEMS)) {
      for (const item of VOCAB_ITEMS) {
        if (item.word) _vocabIndex.set(String(item.word).toLowerCase(), item);
        if (item.lemma) {
          const key = String(item.lemma).toLowerCase();
          if (!_vocabIndex.has(key)) _vocabIndex.set(key, item);
        }
      }
    }
    // 用户自定义词也进索引
    const custom = _readLS(LS_CUSTOM, []);
    if (Array.isArray(custom)) {
      for (const item of custom) {
        if (item.word) _vocabIndex.set(String(item.word).toLowerCase(), item);
      }
    }
    return _vocabIndex;
  }

  /**
   * 查词：返回 { chinese, source: 'vocab'|'dict'|'none', item? }
   */
  function lookup(rawWord) {
    const index = _buildVocabIndex();
    for (const cand of _lemmaCandidates(rawWord)) {
      const item = index.get(cand);
      if (item) {
        return { chinese: item.chinese || item.work_meaning || '', source: 'vocab', item };
      }
    }
    for (const cand of _lemmaCandidates(rawWord)) {
      if (FUNCTION_WORDS[cand]) return { chinese: FUNCTION_WORDS[cand], source: 'dict' };
      if (QUESTION_WORDS[cand]) return { chinese: QUESTION_WORDS[cand], source: 'dict' };
    }
    return { chinese: '', source: 'none' };
  }

  /**
   * 把英文文本中的词包成可点击 span（输出已是 HTML 转义后的安全字符串）。
   * 注意：转义产生的实体（&lt; &amp; 等）必须原样跳过，不能被包装打碎。
   */
  function glossify(text) {
    const safe = _esc(text);
    return safe.replace(/&(?:amp|lt|gt|quot|#39);|[A-Za-z][A-Za-z'’-]*/g, (m) =>
      m.charAt(0) === '&'
        ? m
        : `<span class="gloss-word" data-w="${m}">${m}</span>`
    );
  }

  // --- 底部弹出卡片 ---
  let _popupEl = null;

  function _closePopup() {
    if (_popupEl) { _popupEl.remove(); _popupEl = null; }
  }

  function _showPopup(word, sentence) {
    _closePopup();
    const result = lookup(word);
    const known = _readLS(LS_KNOWN, []);
    const isKnown = Array.isArray(known) && known.includes(word.toLowerCase());

    let meaningHTML;
    if (result.source === 'vocab') {
      const wm = result.item.work_meaning && result.item.work_meaning !== result.chinese
        ? `<div class="gloss-sub">工作语境：${_esc(result.item.work_meaning)}</div>` : '';
      meaningHTML = `<div class="gloss-cn">${_esc(result.chinese)}</div>${wm}`;
    } else if (result.source === 'dict') {
      meaningHTML = `<div class="gloss-cn">${_esc(result.chinese)}</div>`;
    } else {
      meaningHTML = `<div class="gloss-cn gloss-cn-none">暂未收录该词，可加入学习队列稍后补充</div>`;
    }

    const el = document.createElement('div');
    el.className = 'gloss-popup';
    el.innerHTML = `
      <div class="gloss-popup-inner">
        <div class="gloss-head">
          <span class="gloss-word-title">${_esc(word)}</span>
          <button class="gloss-audio" data-act="speak" title="播放发音">🔊</button>
          <button class="gloss-close" data-act="close">✕</button>
        </div>
        ${meaningHTML}
        ${isKnown ? '<div class="gloss-known-tag">✓ 已标记认识</div>' : ''}
        <div class="gloss-actions">
          <button class="btn btn-ghost btn-sm flex-1" data-act="known">认识了</button>
          <button class="btn btn-primary btn-sm flex-1" data-act="queue">加入学习队列</button>
        </div>
      </div>
    `;
    document.body.appendChild(el);
    _popupEl = el;

    el.addEventListener('click', (e) => {
      const act = e.target.closest('[data-act]');
      if (!act) return;
      e.stopPropagation();
      const action = act.getAttribute('data-act');
      if (action === 'close') {
        _closePopup();
      } else if (action === 'speak') {
        try {
          if (typeof SpeechUtils !== 'undefined' && SpeechUtils.speak) {
            SpeechUtils.speak(word, { rate: 0.9 });
          }
        } catch (err) {}
      } else if (action === 'known') {
        const list = _readLS(LS_KNOWN, []);
        const lw = word.toLowerCase();
        if (Array.isArray(list) && !list.includes(lw)) {
          list.push(lw);
          _writeLS(LS_KNOWN, list);
        }
        if (typeof showToast === 'function') showToast(`已标记「${word}」为认识`);
        _closePopup();
      } else if (action === 'queue') {
        _addToQueue(word, sentence, result);
        _closePopup();
      }
    });
  }

  function _addToQueue(word, sentence, result) {
    const queue = _readLS(LS_QUEUE, []);
    const qArr = Array.isArray(queue) ? queue : [];
    let vocabId;

    if (result.source === 'vocab' && result.item && result.item.id) {
      vocabId = result.item.id;
    } else {
      // 词库外：创建自定义词条，例句绑定点击时的真实语境
      vocabId = 'u-' + word.toLowerCase();
      const custom = _readLS(LS_CUSTOM, []);
      const cArr = Array.isArray(custom) ? custom : [];
      if (!cArr.some(c => c.id === vocabId)) {
        cArr.push({
          id: vocabId,
          word: word,
          lemma: word.toLowerCase(),
          pos: '',
          chinese: result.chinese || '（待补充释义）',
          work_meaning: result.chinese || '',
          example_en: sentence || '',
          example_cn: '',
          day: 0,
          work_relevance: 3,
          custom: true
        });
        _writeLS(LS_CUSTOM, cArr);
      }
    }

    if (!qArr.includes(vocabId)) {
      qArr.push(vocabId);
      _writeLS(LS_QUEUE, qArr);
      if (typeof showToast === 'function') showToast(`「${word}」已加入学习队列，明天见`);
    } else {
      if (typeof showToast === 'function') showToast(`「${word}」已在学习队列中`);
    }
  }

  // --- 全局点击委托 ---
  document.addEventListener('click', (e) => {
    const span = e.target.closest && e.target.closest('.gloss-word');
    if (span) {
      e.preventDefault();
      e.stopPropagation();
      const word = span.getAttribute('data-w') || span.textContent;
      // 抓取所在句子作为语境（加入队列时存为例句）
      let sentence = '';
      const block = span.closest('p, .word-example, .ea-value, .listening-text, .kb-content, div');
      if (block) sentence = (block.textContent || '').trim().slice(0, 300);
      _showPopup(word, sentence);
      return;
    }
    // 点击弹窗外部：关闭
    if (_popupEl && !e.target.closest('.gloss-popup')) _closePopup();
  }, true);

  // 导出
  window.Gloss = {
    glossify,
    lookup,
    FUNCTION_WORDS
  };
})();

const V2_ALL_LESSONS_EXT = [...V2_DAILY_LESSONS_EXT, ...V2_WEEKS_8_12];

// ===== Merge V2 corpus into main arrays =====
// Merge knowledge items (50 originals + 70 new = 120 total)
if (typeof KNOWLEDGE_ITEMS !== 'undefined') {
  KNOWLEDGE_ITEMS.push(...V2_KNOWLEDGE_ITEMS);
}
// Merge daily lessons (28 original + V2 extensions = 84 days / 12 weeks)
if (typeof DAILY_LESSONS !== 'undefined') {
  DAILY_LESSONS.push(...V2_ALL_LESSONS_EXT);

  // V2 升级：为原始 lessons（Day 1-28）补齐 keywords 和 comprehension_questions
  // 从 listening.text 中自动提取关键短语作为关键词，并生成 3 道理解题
  const STOPWORDS = new Set(['the','a','an','and','or','but','is','are','was','were','be','been','being','have','has','had','do','does','did','will','would','could','should','may','might','can','to','of','in','on','at','by','for','with','from','as','i','you','he','she','we','they','it','this','that','these','those','my','your','our','their','its','me','him','her','us','them','what','which','who','whom','when','where','why','how','not','no','yes','about','into','than','then','so','very','just','only','also']);

  function extractKeywords(text, maxN = 6) {
    if (!text) return [];
    const words = text.toLowerCase().replace(/[.,!?;:"']/g, ' ').split(/\s+/).filter(w => w.length > 3 && !STOPWORDS.has(w));
    const freq = {};
    for (const w of words) freq[w] = (freq[w] || 0) + 1;
    const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]).map(e => e[0]);
    // 选择最具代表性的 3-6 个词
    const picked = [];
    for (const w of sorted) {
      if (picked.length >= maxN) break;
      // 跳过纯数字
      if (/^\d+$/.test(w)) continue;
      picked.push(w);
    }
    // 保留原大小写
    return picked.map(w => {
      const idx = text.toLowerCase().indexOf(w);
      return idx >= 0 ? text.substring(idx, idx + w.length) : w;
    });
  }

  // 选项洗牌：正确答案不再固定在第一项
  function _shuffleOptions(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // 组装一道理解题。约定：correct 必须原样出现在 options 里（判定用 indexOf 精确匹配），
  // explain 为中文解析，src 为原文依据句（用于答错解析定位与重听）
  function _mkQuestion(qText, correct, distractors, explain, src) {
    const opts = _shuffleOptions([correct, ...distractors.filter(d => d && d !== correct).slice(0, 3)]);
    return { q: qText, a: correct, options: opts, explain: explain, src: src };
  }

  function generateQuestions(text, title) {
    const qs = [];
    const sentences = (String(text || '').match(/[^.!?]+[.!?]+/g) || [String(text || '')])
      .map(s => s.trim()).filter(s => s.length > 5);
    if (!sentences.length) return qs;
    const first = sentences[0];
    const last = sentences[sentences.length - 1];
    // 细节句：取中间一句，尽量与首句/尾句错开
    const mid = sentences.length > 2 ? sentences[1] : last;

    // 问题 1：主旨类——答案就是原文第一句（完整句子，不截断不加标点，保证与选项逐字一致）
    qs.push(_mkQuestion(
      `What is the main topic of "${title || 'this listening'}?`,
      first,
      ['A complaint about a delayed project.',
       'A request for additional resources.',
       'A summary of last quarter\'s results.'],
      '主旨题看开头：听力第一句通常点明主题，原文第一句就是答案依据。其余选项（投诉延期 / 申请资源 / 季度总结）原文均未提及。',
      first
    ));

    // 问题 2：数字/时间类（如果有）；否则细节类
    const numMatch = String(text).match(/(\d+(?:\.\d+)?\s*(?:percent|%|days?|hours?|weeks?|months?))/i);
    if (numMatch) {
      const numSentence = sentences.find(s => s.indexOf(numMatch[0]) >= 0) || first;
      qs.push(_mkQuestion(
        'Which number or timeline is mentioned?',
        numMatch[0],
        ['Twice the previous amount', 'Half of the projected figure', 'No specific number'],
        `原文明确提到的数字/时间是「${numMatch[0]}」。`,
        numSentence
      ));
    } else if (sentences.length > 2) {
      qs.push(_mkQuestion(
        'Which statement is true according to the listening?',
        mid,
        ['It has been fully resolved.', 'It has been cancelled.', 'No clear information was given.'],
        '细节题：答案句在原文中明确出现；其余选项（已彻底解决 / 已取消 / 没有明确信息）与原文不符。',
        mid
      ));
    }

    // 问题 3：下一步/结尾类——答案取原文最后一句（与首句不同时才出，避免重复）
    if (last !== first) {
      qs.push(_mkQuestion(
        'What is the next step or key reason?',
        last,
        ['To postpone indefinitely.', 'To reassign to another team.', 'To ignore the issue.'],
        '这类问题的答案通常藏在结尾，原文最后一句就是依据。其余选项（无限期推迟 / 转交别的团队 / 置之不理）原文均未提及。',
        last
      ));
    }

    return qs;
  }

  for (const lesson of DAILY_LESSONS) {
    if (!lesson.listening) continue;
    const lst = lesson.listening;
    // 只对 V1 风格的 listening 升级（无 keywords 字段）
    if (!lst.keywords) {
      lst.keywords = extractKeywords(lst.text);
    }
    // 无理解题 → 自动生成；占位题（options 就是 A/B/C/D，答案是摆设）→ 重新生成
    const _isPlaceholder = Array.isArray(lst.comprehension_questions)
      && lst.comprehension_questions.length > 0
      && lst.comprehension_questions.every(qq => qq && Array.isArray(qq.options)
        && qq.options.join(',') === 'A,B,C,D');
    if (!lst.comprehension_questions || _isPlaceholder) {
      lst.comprehension_questions = generateQuestions(lst.text, lst.title);
    }
    if (!lst.mode) {
      lst.mode = 'study';
    }

    // 同样为 workPractice 添加追问（V2 风格）
    if (lesson.workPractice && !lesson.workPractice.followUps) {
      lesson.workPractice.followUps = [
        'Could you give me a bit more detail on that?',
        'What is the timeline for this?',
        'Who is responsible for the next step?'
      ];
    }
  }
}

    }

    // 提取角色
    const roleKeywords = { '领导': 'manager', 'manager': 'manager', '同事': 'colleague', 'colleague': 'colleague',
      '业主': 'owner', 'owner': 'owner', '资管': 'asset', '城市': 'city_ops', 'city': 'city_ops' };
    for (const [kw, role] of Object.entries(roleKeywords)) {
      if (lowerText.includes(kw.toLowerCase()) && !results.roles.includes(role)) {
        results.roles.push(role);
      }
    }

    // 提取候选表达（简单提取英文句子）
    const sentences = text.match(/[A-Z][a-z].*?[.!?]/g) || [];
    const learningCandidates = sentences.filter(s => s.length > 15 && s.length < 200).slice(0, 20);
    results.learning_items = learningCandidates.map(s => ({
      english: s.trim(), chinese: '', type: 'work_expression',
      source: 'import', scenario_id: results.scenarios[0] || 'other'
    }));

    return results;
  },

  // 生成每日课程（基于当前天和到期复习）
  generateDailySession(studyDay, settings, dueItems, newItemCount) {
    const lesson = DAILY_LESSONS.find(l => l.day === studyDay) || DAILY_LESSONS[0];
    return {
      day: studyDay,
      theme: lesson.theme,
      theme_en: lesson.theme_en,
      listening: lesson.listening,
      review_items: dueItems.slice(0, 10),
      learn_items: lesson.itemIds.slice(0, newItemCount),
      learn_patterns: lesson.patternIds,
      work_practice: lesson.workPractice,
      daily_challenge: lesson.challenge,
      estimated_minutes: settings.dailyMinutes || 25
    };
  },

  // 评估用户回答（基于规则）
  evaluateAnswer(userAnswer, referenceAnswer, opts = {}) {
    const { type = 'work_practice' } = opts;
    const answer = (userAnswer || '').trim().toLowerCase();
    const ref = (referenceAnswer || '').trim().toLowerCase();

    if (!answer || answer.length < 5) {
      return {
        communication_success: 0,
        clarity_score: 0,
        naturalness_score: 0,
        work_fit_score: 0,
        better_version: referenceAnswer || '',
        key_expressions: [],
        error_tags: ['too_short', 'no_answer'],
        feedback: '回答太短或没有内容。请尝试用完整的句子回答。'
      };
    }

    // 简单匹配关键词
    const refWords = ref.split(/\s+/).filter(w => w.length > 3);
    const matched = refWords.filter(w => answer.includes(w));
    const matchRatio = matched.length / Math.max(1, refWords.length);

    // 检查是否有关键句型
    const patterns = ref.match(/[A-Z][a-z]+ [a-z]+ [a-z]+/g) || [];
    const patternMatch = patterns.filter(p => answer.includes(p.toLowerCase()));

    const clarityScore = Math.min(100, Math.round(matchRatio * 60 + (answer.length > 30 ? 20 : 0) + (patternMatch.length > 0 ? 20 : 0)));
    const naturalnessScore = Math.min(100, Math.round(matchRatio * 50 + (answer.length > 50 ? 25 : 0) + (patternMatch.length > 1 ? 25 : 0)));
    const workFitScore = Math.min(100, Math.round(matchRatio * 70 + (patternMatch.length > 0 ? 30 : 0)));
    const commScore = Math.min(100, Math.round((clarityScore + workFitScore) / 2));

    const errorTags = [];
    if (matchRatio < 0.2) errorTags.push('missing_key_points');
    if (answer.length < 20) errorTags.push('too_brief');
    if (!answer.includes('.')) errorTags.push('no_complete_sentence');

    // 提取关键表达
    const keyExpressions = refWords.filter(w => w.length > 4 && answer.includes(w)).slice(0, 5);

    let feedback = '';
    if (commScore >= 70) {
      feedback = '回答清晰，涵盖了关键要点。可以尝试使用更多自然的表达。';
    } else if (commScore >= 40) {
      feedback = '回答涵盖了部分要点，但还可以更完整。参考推荐回答补充缺失内容。';
    } else {
      feedback = '回答与参考答案差距较大。建议先学习关键表达，再尝试组织回答。';
    }

    return {
      communication_success: commScore,
      clarity_score: clarityScore,
      naturalness_score: naturalnessScore,
      work_fit_score: workFitScore,
      better_version: referenceAnswer || '',
      key_expressions: keyExpressions,
      error_tags: errorTags,
      feedback: feedback
    };
  },

  // 生成本地对话追问
  generateFollowUp(scenarioId, userResponse, round, history) {
    const scenario = CONVERSATION_SCENARIOS.find(s => s.id === scenarioId);
    if (!scenario) return null;

    if (round >= scenario.rounds) {
      return { task_complete: true, final_feedback: '对话完成。请回顾你的回答，看看哪些表达可以改进。' };
    }

    const branches = scenario.branches;
    const lowerResp = (userResponse || '').toLowerCase();

    // 关键词匹配
    for (const branch of branches) {
      if (branch.trigger === 'start' && round === 0) continue; // skip start on non-first
      if (branch.trigger.startsWith('keyword:')) {
        const keywords = branch.trigger.replace('keyword:', '').split('|');
        if (keywords.some(kw => lowerResp.includes(kw))) {
          return { next_question: branch.question, follow_up_reason: branch.key_points.join(', '), task_complete: false };
        }
      }
    }

    // 默认分支
    const defaultBranch = branches.find(b => b.trigger === 'default');
    if (defaultBranch) {
      return { next_question: defaultBranch.question, follow_up_reason: defaultBranch.key_points.join(', '), task_complete: false };
    }

    // 兜底
    const nextBranch = branches[Math.min(round, branches.length - 1)];
    return { next_question: nextBranch.question, follow_up_reason: nextBranch.key_points.join(', '), task_complete: false };
  },

  // 获取对话开场
  getOpening(scenarioId) {
    const scenario = CONVERSATION_SCENARIOS.find(s => s.id === scenarioId);
    if (!scenario) return null;
    const startBranch = scenario.branches.find(b => b.trigger === 'start');
    return startBranch ? startBranch.question : 'Let\'s start. Can you tell me about the situation?';
  }
};

// ===== Speech Utils =====
const SpeechUtils = {
  synth: window.speechSynthesis || null,
  recognition: null,
  currentUtterance: null,

  isTTSAvailable() {
    return !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
  },

  isSTTAvailable() {
    return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  },

  speak(text, opts = {}) {
    if (!this.isTTSAvailable()) return false;
    this.stop();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = opts.rate || 1.0;
    utterance.pitch = opts.pitch || 1;

    if (opts.onend) utterance.onend = opts.onend;
    if (opts.onerror) utterance.onerror = opts.onerror;

    this.currentUtterance = utterance;
    this.synth.speak(utterance);
    return true;
  },

  stop() {
    if (this.synth) this.synth.cancel();
    this.currentUtterance = null;
  },

  pause() {
    if (this.synth) this.synth.pause();
  },

  resume() {
    if (this.synth) this.synth.resume();
  },

  startRecognition(opts = {}) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;

    const recognition = new SR();
    recognition.lang = 'en-US';
    recognition.continuous = opts.continuous || false;
    recognition.interimResults = opts.interimResults || false;

    if (opts.onresult) recognition.onresult = opts.onresult;
    if (opts.onerror) recognition.onerror = opts.onerror;
    if (opts.onend) recognition.onend = opts.onend;

    recognition.start();
    this.recognition = recognition;
    return recognition;
  },

  stopRecognition() {
    if (this.recognition) {
      this.recognition.stop();
      this.recognition = null;
    }
  }
};

function _showFallbackBanner() {
  if (!isFallbackMode()) return;
  var existing = document.getElementById('wec-fallback-banner');
  if (existing) return;
  var reason = getFallbackReason() || 'unknown';
  var reasonText = '';
  if (reason.indexOf('blocked') >= 0) reasonText = '数据库被其他标签页占用';
  else if (reason.indexOf('no_indexeddb') >= 0) reasonText = '浏览器不支持 IndexedDB';
  else if (reason.indexOf('timeout') >= 0) reasonText = '数据库响应超时';
  else if (reason.indexOf('quota') >= 0) reasonText = '存储空间不足';
  else reasonText = '数据持久化不可用';

  var banner = document.createElement('div');
  banner.id = 'wec-fallback-banner';
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#fff3cd;color:#856404;padding:8px 16px;font-size:13px;text-align:center;border-bottom:1px solid #ffeaa7;';
  banner.innerHTML = '⚠️ ' + reasonText + '，当前进度可能无法保存。' +

  document.body.appendChild(banner);
}

// ===== 初始化知识库数据 =====
async function _initKnowledgeData() {
  const itemCount = await dbCount(STORES.knowledgeItems);
  if (itemCount === 0) {
    for (const item of KNOWLEDGE_ITEMS) {
      item.status = 'active';
      item.created_at = new Date().toISOString();
      item.updated_at = new Date().toISOString();
      await dbPut(STORES.knowledgeItems, item);
      const mastery = WEC_Algo.initMastery(item.id);
      await dbPut(STORES.masteryRecords, mastery);
      await dbPut(STORES.reviewSchedule, {
        item_id: item.id,
        next_review_at: Date.now(),
        interval_days: 0,
        review_count: 0,
        mastery_state: 'New'
      });
    }
  } else if (itemCount < KNOWLEDGE_ITEMS.length) {
    const existingItems = await dbGetAll(STORES.knowledgeItems);
    const existingIds = new Set(existingItems.map(i => i.id));
    for (const item of KNOWLEDGE_ITEMS) {
      if (!existingIds.has(item.id)) {
        item.status = 'active';
        item.created_at = new Date().toISOString();
        item.updated_at = new Date().toISOString();
        await dbPut(STORES.knowledgeItems, item);
        const mastery = WEC_Algo.initMastery(item.id);
        await dbPut(STORES.masteryRecords, mastery);
        await dbPut(STORES.reviewSchedule, {
          item_id: item.id,
          next_review_at: Date.now(),
          interval_days: 0,
          review_count: 0,
          mastery_state: 'New'
        });
      }
    }
  }
}

// ===== Init =====
async function initApp() {
  appSettings = loadSettings();
  if (!appSettings.studyStartDate) {
    appSettings.studyStartDate = todayStr();
    try { saveSettings(appSettings); } catch (e) { console.warn('saveSettings failed', e); }
  }
  appState = loadState();

  // 尝试正常初始化；DB 失败时 db.js 自动切换到降级模式
  try {
    await _initKnowledgeData();
    await _initSkillScores();
    router(appState.currentPage || 'today');
  } catch (err) {
    console.error('initApp error:', err);
    if (!isFallbackMode()) {
      enableFallbackMode('init_error:' + ((err && err.message) || 'unknown'));
    }
    // 降级模式下重新初始化内存数据
    try {
      await _initKnowledgeData();
      await _initSkillScores();
      router(appState.currentPage || 'today');
    } catch (err2) {
      console.error('initApp fallback also failed:', err2);
      _showFatalError(err2);
      return;
    }
  }

  // 无论成功还是降级，都标记完成
  if (window.__WEC_BOOT__) window.__WEC_BOOT__.finished = true;
  if (isFallbackMode()) {
    _showFallbackBanner();
  }
}

function _showFatalError(err) {
  var detail = (err && (err.message || err.toString())) || '未知错误';
  var diag = {};
  try { diag = getDBDiagnostics(); } catch(e) {}
  var app = document.getElementById('app');
  if (app) {
    app.innerHTML = '' +
      '<div style="padding: 32px 20px; max-width: 480px; margin: 0 auto; text-align: center;">' +
        '<div style="font-size: 48px; margin-bottom: 12px;">⚠️</div>' +
        '<h2 style="color: #1a2e28; margin-bottom: 12px;">应用启动失败</h2>' +
        '<p style="color: #5a6e68; font-size: 14px; line-height: 1.6; margin-bottom: 16px;">' +
          'IndexedDB 不可用且内存模式也失败了。请尝试刷新或清理浏览器数据后重试。' +
        '</p>' +
        '<details style="text-align:left; margin-bottom:24px; background:#f0f2f1; padding:12px; border-radius:8px; font-size:12px; color:#5a6e68;">' +
          '<summary style="cursor:pointer; font-weight:600;">诊断信息</summary>' +
          '<pre style="margin-top:8px; white-space:pre-wrap;">' +
            'error: ' + String(detail) + '\n' +
            'diag: ' + JSON.stringify(diag, null, 2) +
          '</pre>' +
        '</details>' +
        '<button id="wec-retry-btn2" style="background: #1a6b4e; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-right: 8px;">🔄 重试</button>' +
        '<button id="wec-clear-btn" style="background: transparent; color: #5a6e68; border: 1px solid #d4e0db; padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer;">清理数据并重试</button>' +
      '</div>';
    var retryBtn = document.getElementById('wec-retry-btn2');
    if (retryBtn) retryBtn.addEventListener('click', function () { location.reload(); });
    var clearBtn = document.getElementById('wec-clear-btn');
    if (clearBtn) clearBtn.addEventListener('click', function () {
      if (window.confirm('将清空 IndexedDB 与 localStorage 后重启。继续？')) {
        try { if (typeof indexedDB !== 'undefined' && indexedDB) indexedDB.deleteDatabase('WorkEnglishCoachDB'); } catch (e) {}
        try { localStorage.clear(); } catch (e) {}
        location.reload();
      }
    });
  }
  if (window.__WEC_BOOT__) {
    window.__WEC_BOOT__.failed = detail;
    window.__WEC_BOOT__.finished = true;
  }
}

// ===== Router =====
function router(page, params = {}) {
  appState.currentPage = page;
  appState.params = params;
  saveState(appState);

  // 更新底部导航
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });

  const app = document.getElementById('app');
  switch(page) {
    case 'today': renderToday(app); break;
    case 'review': renderReview(app); break;
    case 'practice': renderProgress(app); break;
    case 'progress': renderProgress(app); break;
    case 'more': renderMore(app); break;
    case 'learn': renderLearn(app, params); break;
    case 'work-practice': renderWorkPractice(app, params); break;
    case 'daily-challenge': renderDailyChallenge(app, params); break;
    case 'quiz': renderQuiz(app); break;
    case 'conversation': renderConversation(app); break;
    case 'knowledge-base': renderKnowledgeBase(app); break;
    case 'error-bank': renderErrorBank(app); break;
    case 'settings': renderSettingsPage(app); break;
    case 'import': renderImportPage(app); break;
    case 'backup': renderBackupPage(app); break;
    case 'listening': renderListening(app, params); break;
    case 'session-summary': renderSessionSummary(app, params); break;
    case 'assessment': renderAssessment(app); break;
    case 'vocab-precheck': startVocabSession(getStudyDay(appSettings)); break;
    default: renderToday(app);
  }
  window.scrollTo(0, 0);
}
